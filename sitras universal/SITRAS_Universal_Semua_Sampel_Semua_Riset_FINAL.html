const QR_PAYLOAD_VERSION = 2;
function qrBaseUrlForCode(code){
  const t = trim(DB.cfg && DB.cfg.qrUrl);
  if(t && t.indexOf('{kode}')>=0 && code && code!=='-') return t.replace('{kode}', encodeURIComponent(code));
  return '';
}
function appendQrParams(url, extra){
  if(!url) return '';
  try{
    const u = new URL(url, location.href);
    Object.entries(extra||{}).forEach(([k,v])=>{
      const text = trim(v);
      if(text) u.searchParams.set(k, text);
    });
    return u.toString();
  }catch(e){
    const parts = Object.entries(extra||{}).filter(([,v])=>trim(v)!=='')
      .map(([k,v])=>`${encodeURIComponent(k)}=${encodeURIComponent(trim(v))}`);
    if(!parts.length) return url;
    return url + (url.indexOf('?')>=0 ? '&' : '?') + parts.join('&');
  }
}
/* Checksum sederhana (djb2 mod 36^3) untuk mendeteksi salah ketik kode. */
function qrChecksum(text){
  let h = 5381;
  const s = String(text||'');
  for(let i=0;i<s.length;i++) h = ((h*33) ^ s.charCodeAt(i)) >>> 0;
  return (h % 46656).toString(36).toUpperCase().padStart(3,'0');
}
/* QR sampel: tautan bila base-URL diisi, selain itu payload lokal ringkas. */
function sampleQrText(s){
  if(!s) return '';
  const project = projectById(s.projectId);
  const base = qrBaseUrlForCode(s.id);
  if(base){
    return appendQrParams(base, {v:QR_PAYLOAD_VERSION, p:project?project.code:'', o:'S', c:qrChecksum(s.id)});
  }
  return [
    'SITRAS/'+QR_PAYLOAD_VERSION,
    'OBJ:S',
    'PRJ:'+(project? project.code : '-'),
    'ID:'+s.id,
    'NAMA:'+(sampleDisplayName(s)||'-'),
    'TIPE:'+(s.type||'-'),
    'CHK:'+qrChecksum(s.id)
  ].join('\n');
}
function buildProcessCode(sample, test){
  if(!sample || !test) return '';
  if(!isProcessCategory(test.category)) return '';
  const cat = categoryOf(test.category);
  const parts = [slugCode(cat? cat.code : 'PRC','PRC')];
  parts.push(slugCode(sample.id.replace(/[^A-Za-z0-9]/g,'').slice(-8),''));
  if(trim(test.batch)) parts.push(slugCode(test.batch,''));
  if(trim(test.replicate)) parts.push('R'+slugCode(test.replicate,''));
  return parts.filter(Boolean).join('-');
}
function buildTestQrPayload(sample, test){
  if(!sample) return '';
  const project = projectById(sample.projectId);
  const defs = categoryParams(test && test.category);
  const summary = paramSummary(defs, test && test.paramValues);
  const lines = [
    'SITRAS/'+QR_PAYLOAD_VERSION,
    'OBJ:T',
    'PRJ:'+(project? project.code : '-'),
    'SMP:'+sample.id
  ];
  if(test && trim(test.testCode)) lines.push('UJI:'+test.testCode);
  if(test && trim(test.category)) lines.push('KAT:'+test.category);
  if(test && trim(test.method)) lines.push('MTD:'+test.method);
  if(test && trim(test.batch)) lines.push('BATCH:'+test.batch);
  if(test && trim(test.replicate)) lines.push('REP:'+test.replicate);
  const pc = buildProcessCode(sample, test||{});
  if(pc) lines.push('PROC:'+pc);
  if(summary) lines.push('PARAM:'+summary.slice(0,160));
  lines.push('CHK:'+qrChecksum(sample.id+'|'+((test&&test.id)||'')));
  return lines.join('\n');
}
function buildTestQrLink(sample, test){
  if(!sample) return '';
  const base = qrBaseUrlForCode(sample.id);
  if(!base) return '';
  const project = projectById(sample.projectId);
  return appendQrParams(base, {
    v:QR_PAYLOAD_VERSION, o:'T', p:project?project.code:'',
    t:(test&&trim(test.testCode))||'', pc:buildProcessCode(sample,test||''),
    c:qrChecksum(sample.id+'|'+((test&&test.id)||''))
  });
}

/* Pembuatan QR dengan fallback bila CDN qrcodejs tidak tersedia (mode luring). */
function makeQR(el, text, size, level){
  if(!el) return;
  el.innerHTML='';
  const px = size||128;
  if(typeof QRCode==='undefined'){
    el.innerHTML = '<div class="mono" style="width:'+px+'px;height:'+px+'px;display:flex;align-items:center;justify-content:center;'+
      'color:#000;background:#fff;border:1px dashed #999;font-size:9px;text-align:center;padding:6px;word-break:break-all;line-height:1.2">'+
      esc(String(text).slice(0,120))+'</div>';
    return;
  }
  try{
    new QRCode(el,{text:String(text||'-'), width:px, height:px,
      correctLevel:(level!=null? level : QRCode.CorrectLevel.M), colorDark:'#000000', colorLight:'#ffffff'});
  }catch(e){
    console.warn('[SITRAS] Gagal membuat QR:', e);
    el.textContent = String(text).slice(0,80);
  }
}

let PRINT_BUSY=false, PRINT_CLEANUP_TIMER=0, PRINT_HOOKS_READY=false;
function cleanupPrintState(){
  document.body.classList.remove('printing');
  if(PRINT_CLEANUP_TIMER){ clearTimeout(PRINT_CLEANUP_TIMER); PRINT_CLEANUP_TIMER=0; }
  PRINT_BUSY=false;
}
function ensurePrintHooks(){
  if(PRINT_HOOKS_READY) return;
  window.addEventListener('afterprint', cleanupPrintState);
  if(window.matchMedia){
    const mq = window.matchMedia('print');
    const h = ev => { if(!ev.matches) cleanupPrintState(); };
    if(mq.addEventListener) mq.addEventListener('change', h);
    else if(mq.addListener) mq.addListener(h);
  }
  PRINT_HOOKS_READY=true;
}
function waitForPrintPaint(){
  /* Balapan dengan timeout: bila requestAnimationFrame tidak pernah dipanggil
     (tab latar / peramban headless), pencetakan tetap berjalan. */
  return new Promise(res=>{
    let done=false;
    const finish = ()=>{ if(!done){ done=true; res(); } };
    setTimeout(finish, 300);
    if(typeof requestAnimationFrame==='function') requestAnimationFrame(()=>requestAnimationFrame(finish));
    else finish();
  });
}

function csvEscape(v){ return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'; }
function toCSV(headers, rows){
  return headers.map(h=>csvEscape(h.l)).join(',')+'\n'+
    rows.map(r=>headers.map(h=>csvEscape(typeof h.f==='function'? h.f(r) : r[h.k])).join(',')).join('\n');
}
function downloadBlob(name, text, mime){
  /* CSV diberi UTF-8 BOM agar Excel membaca aksen/utf-8 dengan benar; JSON tidak. */
  const bomPrefix = (mime||'').indexOf('json')>=0 ? '' : '﻿';
  const blob = new Blob([bomPrefix + text], {type:(mime||'text/csv')+';charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1500);
}

function inspectRestorePayload(payload){
  if(!payload || typeof payload!=='object') throw new Error('Berkas bukan JSON SITRAS yang valid.');
  const isLegacy = !payload.projects && Array.isArray(payload.samples);
  return {

    projects: arr(payload.projects).length,
    samples: arr(payload.samples).length,
    tests: arr(payload.tests).length,
    movements: arr(payload.movements).length,
    masterData: payload.masterData? MD_KEYS.reduce((n,k)=>n+arr(payload.masterData[k]).length,0) : 0,

/* mode: 'replace' (ganti) atau 'merge' (tambah, anti-duplikasi berdasarkan ID) */
async function restoreFromPayload(payload, mode){
  const info = inspectRestorePayload(payload);
  let data = payload;
  if(info.isLegacy){
    const res = migrateLegacyToV2({samples:arr(payload.samples), tests:arr(payload.tests), movements:arr(payload.movements), cfg:payload.sharedConfig||payload.cfg||{}});
    data = serializeFromDbObject(res.db);
  }
  const before = {p:DB.projects.length, s:DB.samples.length, t:DB.tests.length, m:DB.movements.length};
  if(mode==='replace'){
    DB.projects  = arr(data.projects);
    DB.samples   = arr(data.samples);
    DB.tests     = arr(data.tests);
    DB.movements = arr(data.movements);
    if(data.masterData) DB.masterData = normalizeMasterData(data.masterData);
    if(arr(data.auditLogs).length) DB.auditLogs = arr(data.auditLogs);
  }else{
    const mergeList = (target, incoming, key)=>{
      const seen = new Set(target.map(x=>x[key]));
      arr(incoming).forEach(x=>{ if(!seen.has(x[key])){ target.push(x); seen.add(x[key]); } });
    };
    mergeList(DB.projects, data.projects, 'id');
    mergeList(DB.samples, data.samples, 'id');
    mergeList(DB.tests, data.tests, 'id');
    mergeList(DB.movements, data.movements, 'id');
    if(data.masterData){
      MD_KEYS.forEach(k=>{
        const target = DB.masterData[k] || (DB.masterData[k]=[]);
        arr(data.masterData[k]).forEach(x=>{
          if(!target.some(y=>String(y.code).toUpperCase()===String(x.code).toUpperCase())) target.push(x);
        });
      });
    }
    mergeList(DB.auditLogs, data.auditLogs, 'id');
  }
  /* Konfigurasi bersama diterapkan tanpa menimpa token lokal. */
  const shared = data.sharedConfig || data.cfg;
  if(shared && typeof shared==='object'){
    const keepToken = DB.cfg.githubToken, keepSheetToken = DB.cfg.sheetWriteToken;
    DB.cfg = cfgDefaults(Object.assign({}, DB.cfg, shared, {githubToken:keepToken, sheetWriteToken:keepSheetToken}));
  }
  refreshProjectCounters();
  logAudit('system','restore','restore', before,
    {p:DB.projects.length, s:DB.samples.length, t:DB.tests.length, m:DB.movements.length}, 'mode='+mode);
  await persistAll({skipRemote:true});
  toast('Restore selesai: '+DB.samples.length+' sampel, '+DB.tests.length+' uji');
  closeModal();
  render();
}

  };
}

/* --- Parser CSV (menangani UTF-8 BOM, kutip, koma) --- */
function csvParse(text){
  let t = String(text==null?'':text);
  if(t.charCodeAt(0)===0xFEFF) t = t.slice(1);          // buang BOM
  t = t.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  const rows=[]; let row=[], f='', i=0, q=false;
  while(i<t.length){
    const c=t[i];
    if(q){
      if(c==='"'){ if(t[i+1]==='"'){ f+='"'; i++; } else q=false; }
      else f+=c;
    }else{
      if(c==='"') q=true;
      else if(c===','){ row.push(f); f=''; }
      else if(c==='\n'){ row.push(f); rows.push(row); row=[]; f=''; }
      else f+=c;
    }
    i++;
  }
  if(f!=='' || row.length){ row.push(f); rows.push(row); }
  return rows;
}
function csvObjects(text){
  const rows = csvParse(text).filter(r=>r.some(c=>trim(c)!==''));
  if(!rows.length) return {head:[], rows:[]};
  const head = rows[0].map(h=>trim(h));
  return {head, rows: rows.slice(1).map(r=>{
    const o={}; head.forEach((h,i)=>o[h]=trim(r[i]==null?'':r[i])); return o;
  })};
}
function pickCol(o, names){
  const keys = Object.keys(o);
  for(const n of names){ const k = keys.find(k=>k.trim().toLowerCase()===n); if(k!==undefined) return o[k]; }
  for(const n of names){ const k = keys.find(k=>k.trim().toLowerCase().includes(n)); if(k) return o[k]; }
  return '';
}
function validateCsvHeader(head, which){
  const required = {
    projects:['kode proyek','judul'],
    samples :['kode sampel'],
    tests   :['kode sampel','kategori'],
    movements:['kode sampel','aksi'],
    masterdata:['kelompok','kode','nama']
  }[which] || [];
  const lower = head.map(h=>h.trim().toLowerCase());
  const missing = required.filter(r=>!lower.some(h=>h===r || h.includes(r)));
  return missing;
}

/* Impor CSV dengan laporan baris gagal. */
async function importCsvText(which, text, mode){
  const {head, rows} = csvObjects(text);
  if(!rows.length) throw new Error('Berkas CSV kosong atau tidak terbaca.');
  const missing = validateCsvHeader(head, which);
  if(missing.length) throw new Error('Header CSV tidak lengkap. Kolom wajib belum ada: '+missing.join(', '));
  const failed = [];
  let added=0, skipped=0;
  const defaultProject = ACTIVE_PROJECT || (DB.projects[0]? DB.projects[0].id : '');

  if(which==='masterdata'){
    rows.forEach((r,i)=>{
      const m = mapMasterRow(r);
      if(!m || !trim(m.item.code)){ failed.push({line:i+2, reason:'kelompok/kode tidak valid'}); return; }
      const list = DB.masterData[m.group] || (DB.masterData[m.group]=[]);
      const exist = list.find(x=>String(x.code).toUpperCase()===String(m.item.code).toUpperCase());
      if(exist){ if(mode==='replace'){ Object.assign(exist, m.item, {id:exist.id}); added++; } else skipped++; }
      else { list.push(m.item); added++; }
    });
    await save(['MD','AL']);
  }else if(which==='projects'){
    if(mode==='replace') DB.projects = [];
    rows.forEach((r,i)=>{
      const p = mapProjectRow(r);
      if(!p.code || !p.title){ failed.push({line:i+2, reason:'kode proyek / judul kosong'}); return; }
      const exist = projectByCode(p.code);
      if(exist){ if(mode==='replace'){ Object.assign(exist, p, {id:exist.id}); added++; } else skipped++; return; }
      DB.projects.push(p); added++;
    });
    await save(['P','AL']);
  }else if(which==='samples'){
    if(mode==='replace') DB.samples = [];
    rows.forEach((r,i)=>{
      const s = mapSampleRow(r, defaultProject);
      if(!s.id){ failed.push({line:i+2, reason:'kode sampel kosong'}); return; }
      if(trim(s.massInitial)!=='' && num(s.massInitial)<0){ failed.push({line:i+2, reason:'jumlah awal negatif'}); return; }
      if(s.material) mdEnsure('materials', s.material, s.material, {desc:'Ditambahkan otomatis saat impor'});
      if(s.type) mdEnsure('sampleTypes', s.type, s.type, {desc:'Ditambahkan otomatis saat impor'});
      if(s.unit) mdEnsure('units', s.unit, s.unit, {desc:'Ditambahkan otomatis saat impor'});
      if(s.status) mdEnsure('sampleStatuses', slugCode(s.status.slice(0,4),'ST'), s.status, {desc:'Impor', color:'muted'});
      const exist = sampleById(s.id);
      if(exist){ if(mode==='replace'){ Object.assign(exist, s); added++; } else skipped++; return; }
      DB.samples.push(s); added++;
    });
    refreshProjectCounters();
    await save(['S','MD','P','AL']);
  }else if(which==='tests'){
    if(mode==='replace') DB.tests = [];
    rows.forEach((r,i)=>{
      const t = mapTestRow(r, defaultProject);
      if(!t.sampleCode){ failed.push({line:i+2, reason:'kode sampel kosong'}); return; }
      if(!sampleById(t.sampleCode)){ failed.push({line:i+2, reason:'sampel "'+t.sampleCode+'" tidak ada di buku induk'}); return; }
      if(t.category) mdEnsure('testCategories', slugCode(t.category.slice(0,4),'CAT'), t.category, {desc:'Impor', params:[]});
      DB.tests.push(t); added++;
    });
    refreshProjectCounters();
    await save(['T','MD','P','AL']);
  }else if(which==='movements'){
    if(mode==='replace') DB.movements = [];
    rows.forEach((r,i)=>{
      const m = mapMovementRow(r, defaultProject);
      if(!m.sampleCode){ failed.push({line:i+2, reason:'kode sampel kosong'}); return; }
      DB.movements.push(m); added++;
    });
    DB.samples.forEach(s=>{ const loc=currentLocation(s.id); if(loc) s.loc=loc; });
    await save(['M','S','AL']);
  }else{
    throw new Error('Jenis impor tidak dikenal.');
  }
  logAudit('system','import-'+which,'import', null, {added, skipped, failed:failed.length}, 'mode='+mode);
  await save('AL',{skipRemote:true});
  return {added, skipped, failed, total:rows.length};
}

function githubOwner(){ return trim(DB.cfg.githubOwner); }
function githubRepo(){ return trim(DB.cfg.githubRepo); }
function githubBranch(){ return trim(DB.cfg.githubBranch) || DEFAULT_GITHUB_BRANCH; }
function githubPath(){ return trim(DB.cfg.githubPath) || DEFAULT_GITHUB_PATH; }
function hasGitHubSource(){ return !!(githubOwner() && githubRepo() && githubPath()); }
function hasGitHubWrite(){ return hasGitHubSource() && !!trim(DB.cfg.githubToken); }
function githubPathEncoded(){ return githubPath().split('/').filter(Boolean).map(encodeURIComponent).join('/'); }
function githubContentsUrl(){ return `https://api.github.com/repos/${encodeURIComponent(githubOwner())}/${encodeURIComponent(githubRepo())}/contents/${githubPathEncoded()}`; }
function githubReadUrl(){ return `${githubContentsUrl()}?ref=${encodeURIComponent(githubBranch())}`; }
function githubHeaders(){
  const h = {'Accept':'application/vnd.github+json'};
  const token = trim(DB.cfg.githubToken);
  if(token) h.Authorization = 'Bearer '+token;
  return h;
}
function b64EncodeUnicode(text){
  const bytes = new TextEncoder().encode(String(text));
  let binary=''; bytes.forEach(b=>binary+=String.fromCharCode(b));
  return btoa(binary);
}
function b64DecodeUnicode(text){
  const clean = String(text||'').replace(/\s/g,'');
  const binary = atob(clean);
  const bytes = Uint8Array.from(binary, c=>c.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}
/* Payload sinkron lengkap - schema v2 (tanpa token). */
function serializeSyncPayload(reason, schemaName, schemaVersion){
  const p = serializeFullDb({});
  p.schema = schemaName || DB_SCHEMA;
  p.schemaVersion = schemaVersion || DB_SCHEMA_VERSION;
  p.version = p.schemaVersion;
  p.reason = reason || 'manual';
  return p;
}
function applySyncPayload(payload, source){
  if(!payload || typeof payload!=='object') throw new Error('Format data '+source+' tidak valid');
  if(payload.ok===false) throw new Error(payload.message || (source+' mengembalikan error'));
  const version = Number(payload.schemaVersion || payload.version || 0);
  if(!arr(payload.projects).length && arr(payload.samples).length && version<2){
    /* Payload lama (v1) -> migrasikan supaya data tetap terbaca. */
    const res = migrateLegacyToV2({samples:arr(payload.samples), tests:arr(payload.tests), movements:arr(payload.movements), cfg:payload.sharedConfig||{}});
    DB.projects = res.db.projects; DB.samples = res.db.samples;
    DB.tests = res.db.tests; DB.movements = res.db.movements;
    if(!DB.masterData || !md('materials').length) DB.masterData = res.db.masterData;
    return;
  }
  DB.projects  = arr(payload.projects);
  DB.samples   = arr(payload.samples);
  DB.tests     = arr(payload.tests);
  DB.movements = arr(payload.movements);
  if(payload.masterData) DB.masterData = normalizeMasterData(payload.masterData);
  if(arr(payload.auditLogs).length) DB.auditLogs = arr(payload.auditLogs);
  const shared = payload.sharedConfig || payload.cfg;
  if(shared && typeof shared==='object'){
    const keepToken = DB.cfg.githubToken, keepSheetToken = DB.cfg.sheetWriteToken;
    DB.cfg = cfgDefaults(Object.assign({}, DB.cfg, shared, {githubToken:keepToken, sheetWriteToken:keepSheetToken}));
  }
  refreshProjectCounters();
}
function gitSourceSummary(){
  if(!hasGitHubSource()) return 'Nonaktif (opsional).';
  return `${githubOwner()}/${githubRepo()} @ ${githubBranch()} / ${githubPath()}`;
}
function gitStatusText(){
  if(!hasGitHubSource()) return 'GitHub nonaktif.';
  const parts=[];
  if(DB.cfg.lastGitHubPull) parts.push('tarik '+fmtDT(DB.cfg.lastGitHubPull));
  if(DB.cfg.lastGitHubPush) parts.push('kirim '+fmtDT(DB.cfg.lastGitHubPush));
  return parts.length? parts.join(' - ') : 'Belum pernah sinkron.';
}

function reportGitHubError(message, manual){
  const text = String(message && message.message ? message.message : message || 'Sinkron GitHub gagal');
  DB.cfg.lastGitHubError = text;
  const now = Date.now();
  if(manual || GitHubSync.lastError!==text || (now-GitHubSync.lastErrorAt)>15000){
    GitHubSync.lastError=text; GitHubSync.lastErrorAt=now;
    toast(text,'err');
  }
  if(VIEW==='sync') render();
}
function scheduleGitHubPush(reason){
  if(!hasGitHubWrite() || DB.cfg.githubAutoSync!==true) return;
  GitHubSync.pending = true;
  if(GitHubSync.busy) return;
  clearTimeout(GitHubSync.timer);
  GitHubSync.timer = setTimeout(()=>{ GitHubSync.timer=null; pushToGitHub({manual:false, reason:reason||'autosave'}); }, GITHUB_SYNC_DELAY_MS);
}
async function saveGitHubConfig(){

async function pullFromGitHub(opts){

    DB.cfg.lastSync = DB.cfg.lastGitHubPull;

    if(opts.renderAfter) render();

async function pushToGitHub(opts){
  opts = Object.assign({manual:true, reason:'manual'}, opts||{});
  if(captureGitHubConfigFromForm()) await save('CFG',{skipRemote:true});
  if(!hasGitHubSource()){ if(opts.manual) toast('Konfigurasi GitHub belum lengkap','err'); return false; }
  if(!hasGitHubWrite()){ if(opts.manual) toast('Token GitHub diperlukan untuk mengirim data','err'); return false; }
  if(GitHubSync.busy){ GitHubSync.pending = true; return false; }
  GitHubSync.busy = true; GitHubSync.pending = false;
  clearTimeout(GitHubSync.timer); GitHubSync.timer = null;
  try{
    let existing = null;
    const head = await fetch(githubReadUrl(), {headers:githubHeaders(), cache:'no-store'});
    if(head.status!==404){
      if(!head.ok) throw new Error('Gagal membaca metadata GitHub (HTTP '+head.status+')');
      existing = await head.json();
    }
    const body = {
      message:'chore: update SITRAS database ('+opts.reason+')',
      content:b64EncodeUnicode(JSON.stringify(serializeSyncPayload(opts.reason), null, 2)),
      branch:githubBranch()
    };
    if(existing && existing.sha) body.sha = existing.sha;
    const res = await fetch(githubContentsUrl(), {method:'PUT', headers:Object.assign({}, githubHeaders(), {'Content-Type':'application/json'}), body:JSON.stringify(body)});
    if(res.status===409) throw new Error('Konflik versi GitHub. Tarik data terbaru dulu, lalu kirim ulang.');
    if(!res.ok) throw new Error('Gagal mengirim data ke GitHub (HTTP '+res.status+')');
    const out = await res.json();
    DB.cfg.lastGitHubPush = nowISO();
    DB.cfg.lastGitHubSha = (out.content && out.content.sha) || DB.cfg.lastGitHubSha || '';
    DB.cfg.lastSync = DB.cfg.lastGitHubPush;
    delete DB.cfg.lastGitHubError;
    await save('CFG',{skipRemote:true});
    if(opts.manual){ toast('Database berhasil dikirim ke GitHub'); render(); }
    return true;
  }catch(e){ reportGitHubError(e, opts.manual); return false; }
  finally{
    GitHubSync.busy = false;
    if(GitHubSync.pending){ GitHubSync.pending=false; scheduleGitHubPush('queued'); }
  }
}

/* ---------- Google Sheets (Apps Script Web App) ---------- */
function normalizeAppsScriptExecUrl(url){
  const t = trim(url);
  if(!t) return '';
  return t.replace(/^https:\/\/script\.google\.com\/macros\/u\/\d+\/s\//i,'https://script.google.com/macros/s/');
}
function sheetWriteUrl(){ return normalizeAppsScriptExecUrl(DB.cfg.sheetWriteUrl); }
function sheetWriteToken(){ return trim(DB.cfg.sheetWriteToken); }
function hasSheetWriteTarget(){ return !!sheetWriteUrl(); }
function isLikelyAppsScriptExecUrl(url){ return /^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec(?:[?#].*)?$/i.test(trim(url)); }
function sheetUrlHelpText(){ return 'URL Web App Google Sheets belum benar atau deployment belum aktif. Salin ulang URL Aplikasi web dari Apps Script (berakhiran /exec).'; }
function sheetAuthHelpText(){ return 'Akses Google Sheets ditolak (403). Buka Apps Script > Deploy > Manage deployments > Web app > Update, otorisasi ulang, dan pastikan aksesnya "Anyone".'; }
function sheetReadUrl(){
  if(!hasSheetWriteTarget()) return '';
  const sep = sheetWriteUrl().indexOf('?')>=0 ? '&' : '?';
  const token = sheetWriteToken();
  return sheetWriteUrl()+sep+'action=export'+(token? '&token='+encodeURIComponent(token) : '');
}
function sheetTargetSummary(){
  if(!hasSheetWriteTarget()) return 'Belum dikonfigurasi.';
  const raw = sheetWriteUrl().replace(/^https?:\/\//,'');
  return raw.length>78? raw.slice(0,77)+'...' : raw;
}
function sheetStatusText(){
  const parts=[];
  if(DB.cfg.lastSheetPull) parts.push('tarik '+fmtDT(DB.cfg.lastSheetPull));
  if(DB.cfg.lastSheetPush) parts.push('kirim '+fmtDT(DB.cfg.lastSheetPush));
  if(DB.cfg.lastSheetSummary) parts.push(DB.cfg.lastSheetSummary);
  return parts.length? parts.join(' - ') : 'Belum pernah sinkron.';
}
function captureSheetSyncConfigFromForm(){
  if(!$('#gsWriteUrl')) return false;
  DB.cfg.sheetWriteUrl = normalizeAppsScriptExecUrl($('#gsWriteUrl').value);
  DB.cfg.sheetWriteToken = trim($('#gsWriteToken').value);
  DB.cfg.sheetWriteAutoSync = !!($('#gsWriteAuto') && $('#gsWriteAuto').checked);
  return true;
}
function reportSheetError(message, manual){
  let text = String(message && message.message ? message.message : message || 'Sinkron Google Sheets gagal');
  const lower = text.toLowerCase();
  if(lower.includes('failed to fetch') || lower.includes('networkerror')) text = sheetAuthHelpText();
  DB.cfg.lastSheetError = text;
  const now = Date.now();
  if(manual || SheetSync.lastError!==text || (now-SheetSync.lastErrorAt)>15000){
    SheetSync.lastError=text; SheetSync.lastErrorAt=now;
    toast(text,'err');
  }
  if(VIEW==='sync') render();
}
function scheduleSheetPush(reason){
  if(!hasSheetWriteTarget() || DB.cfg.sheetWriteAutoSync!==true) return;
  SheetSync.pending = true;
  if(SheetSync.busy) return;
  clearTimeout(SheetSync.timer);
  SheetSync.timer = setTimeout(()=>{ SheetSync.timer=null; pushToGoogleSheets({manual:false, reason:reason||'autosave'}); }, GSHEET_SYNC_DELAY_MS);
}
async function saveSheetSyncConfig(){
  captureSheetSyncConfigFromForm();
  DB.cfg = cfgDefaults(DB.cfg);
  await save('CFG',{skipRemote:true});
  const ok = !trim(DB.cfg.sheetWriteUrl) || isLikelyAppsScriptExecUrl(DB.cfg.sheetWriteUrl);
  toast(ok? 'Konfigurasi Google Sheets disimpan' : sheetUrlHelpText(), ok?'ok':'err');
  render();
}
async function testGoogleSheetsConnection(){
  if(captureSheetSyncConfigFromForm()) await save('CFG',{skipRemote:true});
  if(!hasSheetWriteTarget()){ toast('URL Web App Google Sheets belum diisi','err'); return false; }
  if(!isLikelyAppsScriptExecUrl(sheetWriteUrl())){ toast(sheetUrlHelpText(),'err'); return false; }
  try{
    const res = await fetch(sheetReadUrl(), {method:'GET', headers:{'Accept':'application/json, text/plain, */*'}, cache:'no-store'});
    if(!res.ok){
      if(res.status===403) throw new Error(sheetAuthHelpText());
      if(res.status===404) throw new Error(sheetUrlHelpText());
      throw new Error('Koneksi gagal (HTTP '+res.status+')');
    }
    const out = await res.json();
    if(out && (out.schema===SHEET_SYNC_SCHEMA || out.schema===DB_SCHEMA)){
      toast('Koneksi Google Sheets OK - '+(out.summary || (arr(out.samples).length+' sampel')));
      return true;
    }
    throw new Error('Endpoint merespons, tetapi bukan database SITRAS. Perbarui Apps Script ke versi Universal.');
  }catch(e){ reportSheetError(e, true); return false; }
}
async function pullFromGoogleSheetsSync(opts){
  opts = Object.assign({manual:true, quiet:false, renderAfter:true, onlyWhenEmpty:false}, opts||{});
  if(!hasSheetWriteTarget()){ if(opts.manual && !opts.quiet) toast('URL Web App Google Sheets belum diisi','err'); return false; }
  if(!isLikelyAppsScriptExecUrl(sheetWriteUrl())){ if(!opts.quiet) reportSheetError(sheetUrlHelpText(), opts.manual); return false; }
  if(opts.onlyWhenEmpty && hasAnyData()) return false;
  try{
    const res = await fetch(sheetReadUrl(), {method:'GET', headers:{'Accept':'application/json, text/plain, */*'}, cache:'no-store'});
    if(!res.ok){
      if(res.status===404) throw new Error(sheetUrlHelpText());
      if(res.status===403) throw new Error(sheetAuthHelpText());
      throw new Error('Gagal memuat data Google Sheets (HTTP '+res.status+')');
    }
    const out = await res.json();
    applySyncPayload(out, 'Google Sheets');
    DB.cfg.lastSheetPull = nowISO();
    DB.cfg.lastSheetSummary = (out && out.summary) ? String(out.summary)
      : `${DB.samples.length} sampel - ${DB.tests.length} uji - ${DB.movements.length} log`;
    delete DB.cfg.lastSheetError;
    DB.cfg.lastSync = DB.cfg.lastSheetPull;
    await persistAll({skipRemote:true});
    if(opts.renderAfter) render();
    if(opts.manual && !opts.quiet) toast('Data Google Sheets dimuat: '+DB.samples.length+' sampel');
    return true;
  }catch(e){ if(!opts.quiet) reportSheetError(e, opts.manual); return false; }
}
async function pushToGoogleSheets(opts){
  opts = Object.assign({manual:true, reason:'manual'}, opts||{});
  if(captureSheetSyncConfigFromForm()) await save('CFG',{skipRemote:true});
  if(!hasSheetWriteTarget()){ if(opts.manual) toast('URL Web App Google Sheets belum diisi','err'); return false; }
  if(!isLikelyAppsScriptExecUrl(sheetWriteUrl())){ if(opts.manual) toast(sheetUrlHelpText(),'err'); return false; }
  if(SheetSync.busy){ SheetSync.pending = true; return false; }
  SheetSync.busy = true; SheetSync.pending = false;
  clearTimeout(SheetSync.timer); SheetSync.timer = null;
  try{
    const payload = serializeSyncPayload(opts.reason, SHEET_SYNC_SCHEMA, SHEET_SYNC_VERSION);
    const token = sheetWriteToken();
    if(token) payload.token = token;    // token hanya dikirim ke endpoint, tidak pernah ke backup
    const res = await fetch(sheetWriteUrl(), {
      method:'POST',
      headers:{'Accept':'application/json, text/plain, */*','Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify(payload)
    });
    const txt = await res.text();
    let out=null; try{ out = txt? JSON.parse(txt) : null; }catch(e){ out=null; }
    if(!res.ok){
      if(res.status===404) throw new Error(sheetUrlHelpText());
      if(res.status===403) throw new Error(sheetAuthHelpText());
      throw new Error('Gagal mengirim data ke Google Sheets (HTTP '+res.status+')');
    }
    if(out && out.ok===false) throw new Error(out.message || 'Apps Script menolak sinkron');
    DB.cfg.lastSheetPush = nowISO();
    DB.cfg.lastSheetSummary = (out && out.summary) ? String(out.summary)
      : `${DB.samples.length} sampel - ${DB.tests.length} uji - ${DB.movements.length} log`;
    delete DB.cfg.lastSheetError;
    await save('CFG',{skipRemote:true});
    if(opts.manual){ toast((out && out.message) || 'Data berhasil dikirim ke Google Sheets'); render(); }
    return true;
  }catch(e){ reportSheetError(e, opts.manual); return false; }
  finally{
    SheetSync.busy = false;
    if(SheetSync.pending){ SheetSync.pending=false; scheduleSheetPush('queued'); }
  }
}

async function fetchCSV(url){
  const u = url + (url.indexOf('?')>=0?'&':'?') + '_=' + Date.now();
  const r = await fetch(u, {cache:'no-store'});
  if(!r.ok) throw new Error('HTTP '+r.status);
  return await r.text();
}
async function pullFromCsvSources(opts){
  opts = Object.assign({manual:true, quiet:false, renderAfter:true}, opts||{});
  const bi=trim(DB.cfg.sheetBI), uji=trim(DB.cfg.sheetUJI), log=trim(DB.cfg.sheetLOG);

  if(location.protocol==='file:'){
    if(opts.manual && !opts.quiet) toast('Tarik CSV butuh aplikasi dibuka lewat http(s). Untuk berkas lokal gunakan "Impor berkas CSV".','err');
    return false;
  }
  try{
    let n=0;
    if(bi){ const r = await importCsvText('samples', await fetchCSV(bi), 'merge'); n+=r.added; }
    if(uji){ try{ const r = await importCsvText('tests', await fetchCSV(uji), 'merge'); n+=r.added; }catch(e){ console.warn(e); } }
    if(log){ try{ const r = await importCsvText('movements', await fetchCSV(log), 'merge'); n+=r.added; }catch(e){ console.warn(e); } }
    DB.cfg.lastSync = nowISO();
    await save('CFG',{skipRemote:true});
    if(opts.renderAfter) render();
    if(opts.manual && !opts.quiet) toast('Tersinkron dari CSV: '+n+' baris baru');
    return true;
  }catch(e){
    if(!opts.quiet) toast('Gagal memuat CSV: '+(e.message||e),'err');
    return false;
  }

function customFieldInput(f, prefix, value){
  const id = prefix+f.code;
  const type = trim(f.fieldType)||'text';
  const label = `<label for="${escAttr(id)}">${esc(f.name)}${f.required?' <span class="req">*</span>':''}</label>`;
  let input;
  if(type==='textarea') input = `<textarea id="${escAttr(id)}">${esc(value||'')}</textarea>`;
  else if(type==='select'){
    const opts = String(f.options||'').split(/[;,|]/).map(o=>trim(o)).filter(Boolean);
    input = `<select id="${escAttr(id)}">${selOptions(opts, value, {blank:'- pilih -'})}</select>`;
  }
  else if(type==='checkbox') input = `<label class="chk"><input type="checkbox" id="${escAttr(id)}" ${String(value)==='ya'?'checked':''}> ya</label>`;
  else if(type==='number') input = `<input type="number" step="any" id="${escAttr(id)}" value="${escAttr(value||'')}">`;
  else if(type==='date') input = `<input type="date" id="${escAttr(id)}" value="${escAttr(value||'')}">`;
  else input = `<input type="text" id="${escAttr(id)}" value="${escAttr(value||'')}">`;
  return `<div class="field">${label}${input}${f.desc?`<div class="hint">${esc(f.desc)}</div>`:''}<div class="errmsg" id="err_${escAttr(id)}"></div></div>`;
}

function openRegStepEl(pane){
  $$('.step-pane').forEach(p=>p.classList.remove('on'));
  pane.classList.add('on');
  const idx = parseInt(pane.dataset.step,10);
  if(Number.isFinite(idx)){
    REG_STEP = idx;
    $$('.steps button').forEach((b,i)=> b.classList.toggle('on', i===idx));
  }
}
function setRegStep(step){
  if(step==='all'){
    $$('.step-pane').forEach(p=>p.classList.add('on'));
    $$('.steps button').forEach(b=>b.classList.remove('on'));
    return;
  }
  REG_STEP = parseInt(step,10)||0;
  $$('.step-pane').forEach(p=>p.classList.toggle('on', parseInt(p.dataset.step,10)===REG_STEP));
  $$('.steps button').forEach((b,i)=> b.classList.toggle('on', i===REG_STEP));
}

function refreshCodePreview(){
  const g = id => { const el=document.getElementById(id); return el? trim(el.value) : ''; };
  const manual = $('#manualCode') && $('#manualCode').checked;
  let code;
  if(manual) code = g('f_code') || '-';
  else code = genCode({
    projectId:g('f_project'), material:g('f_material'), type:g('f_type'), origin:slugCode(g('f_origin'),''),
    date:g('f_regDate')||todayISO(), batch:g('f_batch'), run:g('f_run'), replicate:g('f_replicate')
  }) || '-';
  const prev = $('#codePrev'); if(prev) prev.textContent = code;
  const box = $('#regQR');
  if(box){
    if(code && code!=='-'){
      box.style.opacity='1';
      const fake = {id:code, projectId:g('f_project'), name:g('f_name'), alias:g('f_alias'), type:g('f_type')};
      makeQR(box, sampleQrText(fake), 132);
    }else box.style.opacity='.5';
  }
}

function applySampleFilter(list){
  let r = list.slice();
  if(FILTER.type) r = r.filter(s=>s.type===FILTER.type);
  if(FILTER.status) r = r.filter(s=>s.status===FILTER.status);
  if(FILTER.material) r = r.filter(s=>s.material===FILTER.material);
  if(FILTER.year) r = r.filter(s=>String(s.regDate||'').slice(0,4)===FILTER.year);
  const q = trim(FILTER.q).toLowerCase();
  if(q){
    r = r.filter(s=>{
      const p = projectById(s.projectId);
      const hay = [s.id, s.alias, s.name, s.source, s.samplingLoc, s.custodian, s.loc, s.batch, s.run, s.replicate,
        s.notes, s.sampler, mdName('materials',s.material,s.material), mdName('sampleTypes',s.type,s.type),
        p? p.code : '', p? p.title : '', JSON.stringify(s.customFields||{})].join(' ').toLowerCase();
      return hay.includes(q);
    });
  }
  if(!FILTER.showArchivedSamples) r = r.filter(s=>!s.archived);
  return r.sort((a,b)=> String(b.regDate||'').localeCompare(String(a.regDate||'')) || String(b.createdAt||'').localeCompare(String(a.createdAt||'')));
}

function traceNode(s, depth, seen){
  seen = seen || new Set();
  if(seen.has(s.id)){
    return `<div class="trow"><span class="tnode" style="border-left:4px solid var(--terra)"><span class="tc">${esc(s.id)}</span>
      <span class="micro" style="color:var(--terra)">rantai melingkar - dihentikan</span></span></div>`;
  }
  seen.add(s.id);
  const children = sampleChildren(s.id).filter(c=>!ACTIVE_PROJECT || c.projectId===ACTIVE_PROJECT);
  const tcount = sampleTestCount(s.id);
  const sm = statusStyle(s.status, mdAll('sampleStatuses'));
  const p = projectById(s.projectId);
  return `<div class="trow">
    <button class="tnode" ${attrs({act:'sampleDetail', id:s.id})} type="button" style="border-left:4px solid ${sm.c}">
      <span class="tc">${esc(s.id)}</span>
      ${sampleDisplayName(s)?`<span style="font-size:12.5px">${esc(sampleDisplayName(s))}</span>`:''}
      <span class="micro" style="letter-spacing:.06em">${esc(s.type||'-')}</span>
      ${p?`<span class="alias">${esc(p.code)}</span>`:''}
      <span class="mono" style="font-size:11px;color:var(--muted)">${esc(fmtNum(s.massCurrent))} ${esc(s.unit||'')}</span>
      ${tcount?`<span class="pill" style="color:var(--slate);background:var(--slate-l)"><span class="dot" style="background:var(--slate)"></span>${tcount} uji</span>`:''}
      ${pill(s.status, mdAll('sampleStatuses'))}
    </button>
    ${children.length? `<div class="tchildren">${children.map(c=>traceNode(c, depth+1, new Set(seen))).join('')}</div>`:''}
  </div>`;
}

  : `<div class="card"><div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 3v12M18 9v12"/></svg>

}

function mdUsageCount(key, item){
  const c = item.code, n = item.name;
  switch(key){
    case 'materials': return DB.samples.filter(s=>s.material===c).length;
    case 'sampleTypes': return DB.samples.filter(s=>s.type===c).length;
    case 'testCategories': return DB.tests.filter(t=>t.category===n || t.category===c).length;
    case 'testMethods': return DB.tests.filter(t=>trim(t.method).toUpperCase().includes(String(c).toUpperCase())).length;
    case 'units': return DB.samples.filter(s=>s.unit===c).length + DB.tests.filter(t=>t.massUnit===c).length;
    case 'storageConditions': return DB.samples.filter(s=>s.storecond===n).length;
    case 'locations': return DB.samples.filter(s=>s.loc===n).length;
    case 'sampleStatuses': return DB.samples.filter(s=>s.status===n).length;
    case 'testStatuses': return DB.tests.filter(t=>t.status===n).length;
    case 'processTemplates': return DB.tests.filter(t=>t.designCode===c).length;
    case 'customFieldDefinitions': return DB.samples.filter(s=>s.customFields && trim(s.customFields[c])!=='').length;
    default: return 0;
  }
}

let LAST_FOCUS = null;
function openModal(html, wide){
  LAST_FOCUS = document.activeElement;
  const m = $('#modal');
  m.className = 'modal'+(wide?' wide':'');
  m.innerHTML = html;
  $('#overlay').classList.add('show');
  const focusable = m.querySelector('input,select,textarea,button');
  if(focusable) setTimeout(()=>{ try{ focusable.focus(); }catch(e){} }, 30);
}
function closeModal(){
  $('#overlay').classList.remove('show');
  $('#modal').innerHTML='';
  if(LAST_FOCUS && LAST_FOCUS.focus){ try{ LAST_FOCUS.focus(); }catch(e){} }
  LAST_FOCUS = null;
}
function modalHead(title, sub){
  return `<div class="modal-h"><div><h3>${title}</h3>${sub?`<div style="margin-top:5px" class="tagline">${sub}</div>`:''}</div>
    <button class="x" ${attrs({act:'closeModal'})} type="button" aria-label="Tutup">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>`;
}
function confirmModal(opts){
  openModal(`
    ${modalHead(esc(opts.title||'Konfirmasi'))}
    <div class="modal-b">${opts.body||''}</div>
    <div class="modal-f">
      <button class="btn ghost" ${attrs({act:'closeModal'})} type="button">Batal</button>
      <button class="btn ${opts.danger?'danger':'pri'}" ${attrs(Object.assign({act:opts.act}, opts.data||{}))} type="button">${esc(opts.confirmLabel||'Ya, lanjutkan')}</button>
    </div>`);
}

function paramInput(p, value){
  const id = 'tp_'+p.key;
  const unit = p.unit? `<span class="subtle"> (${esc(p.unit)})</span>` : '';
  const label = `<label for="${escAttr(id)}">${esc(p.label)}${unit}</label>`;
  const v = value==null? '' : value;
  let input;
  switch(trim(p.type)){
    case 'number':   input = `<input type="number" step="any" id="${escAttr(id)}" value="${escAttr(v)}" placeholder="${escAttr(p.placeholder||'')}" ${attrs({input:'refreshTestPreview'})}>`; break;
    case 'date':     input = `<input type="date" id="${escAttr(id)}" value="${escAttr(v)}" ${attrs({change:'refreshTestPreview'})}>`; break;
    case 'time':     input = `<input type="time" id="${escAttr(id)}" value="${escAttr(v)}" ${attrs({change:'refreshTestPreview'})}>`; break;
    case 'textarea': input = `<textarea id="${escAttr(id)}" ${attrs({input:'refreshTestPreview'})}>${esc(v)}</textarea>`; break;
    case 'checkbox': input = `<label class="chk"><input type="checkbox" id="${escAttr(id)}" ${String(v)==='ya'?'checked':''} ${attrs({change:'refreshTestPreview'})}> ya</label>`; break;
    case 'select':   input = `<select id="${escAttr(id)}" ${attrs({change:'refreshTestPreview'})}>${selOptions(arr(p.options), v, {blank:'- pilih -'})}</select>`; break;
    case 'unit':     input = `<select id="${escAttr(id)}" ${attrs({change:'refreshTestPreview'})}>${mdOptions('units', v, {blank:'- pilih satuan -'})}</select>`; break;
    case 'file':     input = `<input type="text" id="${escAttr(id)}" value="${escAttr(v)}" placeholder="nama berkas atau tautan" ${attrs({input:'refreshTestPreview'})}>`; break;
    default:         input = `<input type="text" id="${escAttr(id)}" value="${escAttr(v)}" placeholder="${escAttr(p.placeholder||'')}" ${attrs({input:'refreshTestPreview'})}>`;
  }
  return `<div class="field">${label}${input}</div>`;
}
function paramFieldsHTML(category, values){
  const defs = categoryParams(category);
  if(!defs.length){
    return `<div class="hint">Kategori ini belum punya templat parameter. Tambahkan parameter di <b>Master Data &rarr; Kategori pengujian</b> agar formulir menyesuaikan otomatis.</div>`;
  }
  return `<div class="grid3">${defs.map(p=>paramInput(p, values? values[p.key] : '')).join('')}</div>`;
}

function changeTestCategory(){
  const cat = $('#t_cat')? $('#t_cat').value : '';
  const box = $('#t_paramBox');
  if(box) box.innerHTML = paramFieldsHTML(cat, null);
  const info = $('#t_catInfo');
  const c = categoryOf(cat);
  if(info) info.textContent = c? (arr(c.params).length+' parameter'+(c.isProcess?' - proses/eksperimen':'')) : '';
  refreshTestPreview();
}
function refreshTestPreview(){
  const code = $('#t_sample')? $('#t_sample').value : '';
  const s = sampleById(code);
  const cat = $('#t_cat')? $('#t_cat').value : '';
  const defs = categoryParams(cat);
  const values = readParamValues(defs);
  const fake = {
    id:'preview', category:cat, paramValues:values,
    testCode: $('#t_code')? trim($('#t_code').value):'',
    method: $('#t_method')? trim($('#t_method').value):'',
    batch: $('#t_batch')? trim($('#t_batch').value):'',
    replicate: $('#t_replicate')? trim($('#t_replicate').value):''
  };
  const payload = s? buildTestQrPayload(s, fake) : '';
  const txt = $('#t_qrText'); if(txt) txt.textContent = payload || 'pilih sampel untuk melihat payload QR';
  const box = $('#testFormQR');
  if(box){
    if(payload) makeQR(box, payload, 128);
    else box.innerHTML = '<div style="width:128px;height:128px;display:grid;place-items:center;color:var(--muted);font-size:11px;text-align:center" class="mono">pilih sampel<br>untuk QR</div>';
  }
  const hint = $('#t_stockHint');
  if(hint) hint.textContent = s? ('Stok tersedia: '+fmtNum(s.massCurrent)+' '+(s.unit||'')) : '';

function readMdParams(){
  return $$('#md_params .paramrow').map(row=>{
    const g = cls => { const el = row.querySelector(cls); return el? trim(el.value):''; };
    const key = slugCode(g('.md-p-key'),'').toLowerCase().replace(/[^a-z0-9_]/g,'') || ('p'+Math.random().toString(36).slice(2,6));
    const opts = g('.md-p-options').split(';').map(x=>trim(x)).filter(Boolean);
    const o = {key, label:g('.md-p-label')||key, type:g('.md-p-type')||'text', unit:g('.md-p-unit')};
    if(opts.length) o.options = opts;
    return o;
  }).filter(p=>trim(p.label));
}
async function saveMd(key, id){
  const g = i => { const el=document.getElementById(i); return el? trim(el.value):''; };
  const gc = i => { const el=document.getElementById(i); return el? !!el.checked:false; };
  const code = mdCodeFor(key, g('md_code'));
  const name = g('md_name');
  const errs = [];
  if(!code) errs.push({field:'md_code', msg:'Kode singkat wajib diisi (huruf/angka).'});
  else if(md(key).some(x=>x.id!==id && String(x.code).toUpperCase()===code.toUpperCase()))
    errs.push({field:'md_code', msg:'Kode "'+code+'" sudah dipakai pada kelompok ini.'});
  if(!name) errs.push({field:'md_name', msg:'Nama wajib diisi.'});
  if(!showErrors(errs)) return;

  const existing = id? md(key).find(x=>x.id===id) : null;
  const before = snapshot(existing);
  const patch = {code, name, desc:g('md_desc'), active:gc('md_active'), order:num(g('md_order')), updatedAt:nowISO()};
  if(key==='testCategories'){ patch.isProcess = gc('md_isProcess'); patch.params = readMdParams(); }
  if(key==='units'){ patch.family = g('md_family'); patch.factor = numOrBlank(g('md_factor')); patch.symbol = code; }
  if(key==='sampleStatuses'||key==='testStatuses'){ patch.color = g('md_color')||'muted'; }
  if(key==='customFieldDefinitions'){
    patch.target = g('md_target')||'sample'; patch.fieldType = g('md_fieldType')||'text';
    patch.required = g('md_required')==='1'; patch.projectId = g('md_projectId');
    patch.sampleType = g('md_sampleType'); patch.options = g('md_options');
  }
  if(key==='processTemplates'){ patch.vars = g('md_vars'); }

  if(existing) Object.assign(existing, patch);
  else DB.masterData[key].push(Object.assign(mdItem(code,name,patch.desc), patch, {code}));
  logAudit('masterdata:'+key, code, existing?'update':'create', before, snapshot(existing || DB.masterData[key][DB.masterData[key].length-1]), '');
  await save(['MD','AL']);
  closeModal();
  toast('Master data tersimpan');
  render();
}
async function toggleMd(key, id){
  const it = md(key).find(x=>x.id===id); if(!it) return;
  const before = snapshot(it);
  it.active = it.active===false;
  it.updatedAt = nowISO();
  logAudit('masterdata:'+key, it.code, 'toggle', before, snapshot(it), '');
  await save(['MD','AL']);
  toast(it.active? 'Item diaktifkan' : 'Item dinonaktifkan');
  render();
}
async function deleteMd(key, id){
  const it = md(key).find(x=>x.id===id); if(!it) return;
  if(mdUsageCount(key,it)>0){ toast('Item ini sedang dipakai. Gunakan "Nonaktifkan".','err'); return; }
  const before = snapshot(it);
  DB.masterData[key] = md(key).filter(x=>x.id!==id);
  logAudit('masterdata:'+key, it.code, 'delete', before, null, '');
  await save(['MD','AL']);
  toast('Item master data dihapus');
  render();
}

let PENDING_RESTORE = null;
function restorePreview(input){
  const f = input.files && input.files[0];

  const rd = new FileReader();
  rd.onload = ()=>{
    try{

      PENDING_RESTORE = payload;
      openModal(`

          <div class="callout bad"><b>Ganti/replace</b> akan menimpa seluruh data di perangkat ini. <b>Tambah/merge</b> hanya menambahkan entri dengan ID yang belum ada.</div>
        </div>
        <div class="modal-f">
          <button class="btn ghost" ${attrs({act:'closeModal'})} type="button">Batal</button>
          <button class="btn" ${attrs({act:'doRestore', mode:'merge'})} type="button">Tambah / merge</button>
          <button class="btn danger" ${attrs({act:'doRestore', mode:'replace'})} type="button">Ganti / replace</button>
        </div>`);
    }catch(e){
      toast('Berkas JSON tidak valid: '+(e.message||e),'err');
    }
  };
  rd.onerror = ()=> toast('Gagal membaca berkas','err');
  rd.readAsText(f);

async function doRestore(mode){
  if(!PENDING_RESTORE){ toast('Tidak ada berkas restore','err'); return; }
  const payload = PENDING_RESTORE; PENDING_RESTORE = null;
  try{ await restoreFromPayload(payload, mode); }
  catch(e){ toast('Restore gagal: '+(e.message||e),'err'); }
}

function previewCodeTemplate(){
  const tpl = $('#cfg_tpl')? $('#cfg_tpl').value : codeTemplate();
  const padN = parseInt($('#cfg_seqPad')? $('#cfg_seqPad').value : seqPad(), 10) || 3;
  const p = DB.projects[0];
  const ctx = {
    projectId: p? p.id : '', projectCode: p? p.code : 'PRJ',
    material: (mdActive('materials')[0]||{}).code || 'MAT',
    type: (mdActive('sampleTypes')[0]||{}).code || 'TIP',
    origin: trim(DB.cfg.origin) || 'LOK',
    date: todayISO(), batch:'B1', run:'R1', replicate:'1'
  };
  let out = String(tpl||DEFAULT_CODE_TEMPLATE);
  const c = codeContext(ctx);
  c.SEQ = pad(1, Math.min(Math.max(padN,1),8));
  Object.keys(c).forEach(k=>{ out = out.split('{'+k+'}').join(c[k]); });
  out = out.replace(/\{[A-Z]+\}/g,'').replace(/-{2,}/g,'-').replace(/^[-_.]+|[-_.]+$/g,'');
  const el = $('#tplPreview'); if(el) el.textContent = out || '(kosong)';
}
async function saveCodeTemplate(){
  const before = snapshot({codeTemplate:DB.cfg.codeTemplate, seqPad:DB.cfg.seqPad, seqScope:DB.cfg.seqScope});
  DB.cfg.codeTemplate = trim($('#cfg_tpl')? $('#cfg_tpl').value : '') || DEFAULT_CODE_TEMPLATE;
  DB.cfg.seqPad = parseInt($('#cfg_seqPad')? $('#cfg_seqPad').value : 3,10) || 3;
  DB.cfg.seqScope = $('#cfg_seqScope')? $('#cfg_seqScope').value : 'project-material-type-year';
  logAudit('config','codeTemplate','update', before, snapshot({codeTemplate:DB.cfg.codeTemplate, seqPad:DB.cfg.seqPad, seqScope:DB.cfg.seqScope}), '');
  await save(['CFG','AL'],{skipRemote:true});
  toast('Templat kode disimpan. Kode sampel yang sudah ada tidak berubah.');
  render();
}
function previewQrUrl(){
  const inp = $('#qrUrlInput'), pv = $('#qrUrlPreview');
  if(!pv) return;
  const sample = (DB.samples[0] && DB.samples[0].id) || 'PRJ-BMS-RAW-LOK-26-001';
  const t = inp? trim(inp.value) : '';
  let out;
  if(t && t.indexOf('{kode}')>=0) out = t.replace('{kode}', encodeURIComponent(sample));
  else if(t) out = '(tambahkan {kode} ke templat) - sementara QR memuat payload lokal';
  else out = sample+'   (mode lokal: QR memuat identitas ringkas)';
  pv.textContent = out;
}
async function saveQrUrl(){
  const v = trim($('#qrUrlInput')? $('#qrUrlInput').value : '');
  if(v && v.indexOf('{kode}')<0){ showErrors([{field:'qrUrlInput', msg:'Templat harus memuat {kode}.'}]); return; }
  if(v && !isSafeUrl(v)){ showErrors([{field:'qrUrlInput', msg:'URL harus https:// atau path relatif.'}]); return; }
  DB.cfg.qrUrl = v;
  await save('CFG',{skipRemote:true});
  toast(v? 'Base-URL QR disimpan - QR kini memuat tautan' : 'Mode lokal aktif');
  previewQrUrl();
}
async function clearQrUrl(){
  DB.cfg.qrUrl='';
  const inp = $('#qrUrlInput'); if(inp) inp.value='';
  await save('CFG',{skipRemote:true});
  toast('Mode lokal aktif (QR memuat identitas ringkas)');
  previewQrUrl();
}
function applyBranding(){
  const n = trim(DB.cfg.labName) || APP_NAME;
  const s = trim(DB.cfg.labSub) || DEFAULT_LAB_SUB;
  try{ document.title = n+' - '+APP_NAME; }catch(e){}
  const h = document.getElementById('brandName'); if(h) h.textContent = n;
  const sub = document.getElementById('brandSub'); if(sub) sub.textContent = s;
  const lg = document.getElementById('brandLogo');
  if(lg){
    lg.setAttribute('title', n);
    const logo = trim(DB.cfg.logoUrl);
    if(logo && isSafeUrl(logo)){
      const img = document.createElement('img');
      img.alt = n; img.src = logo;
      img.onerror = ()=>{ lg.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6.5L5.5 17a2 2 0 0 0 1.8 3h9.4a2 2 0 0 0 1.8-3L14 9.5V3"/><path d="M7.5 14h9"/></svg>'; };
      lg.innerHTML=''; lg.appendChild(img);
    }
  }
}

/* ---------- PENCARIAN GLOBAL (Modul 9) ---------- */
function globalSearchSubmit(value){
  const q = trim(value).toLowerCase();
  if(!q) return;
  const exactSample = DB.samples.find(s=>String(s.id).toLowerCase()===q || trim(s.alias).toLowerCase()===q);
  if(exactSample){ openSampleDetail(exactSample.id); return; }
  const proj = DB.projects.find(p=>String(p.code).toLowerCase()===q);
  if(proj){ ACTIVE_PROJECT = proj.id; VIEW='dash'; render(); toast('Proyek aktif: '+proj.code); return; }
  const test = DB.tests.find(t=>trim(t.certNo).toLowerCase()===q || trim(t.testCode).toLowerCase()===q);
  if(test){ openTestForm({id:test.id}); return; }
  /* selain itu: buka buku induk dengan filter pencarian */
  FILTER.q = trim(value); TEST_FILTER.q = trim(value);
  VIEW='db'; render();
}

function runAction(name, dataset, el, ev){
  const fn = Actions[name];
  if(!fn){ console.warn('[SITRAS] Aksi tidak dikenal:', name); return; }
  try{
    const out = fn(dataset, el, ev);
    if(out && typeof out.catch==='function') out.catch(e=>{ console.error('[SITRAS] Aksi gagal:', name, e); toast('Terjadi galat: '+(e.message||e),'err'); });
  }catch(e){
    console.error('[SITRAS] Aksi gagal:', name, e);
    toast('Terjadi galat: '+(e.message||e),'err');
  }
}
document.addEventListener('click', ev=>{
  const el = ev.target.closest('[data-act]');
  if(!el) return;
  if(el.disabled) return;
  ev.preventDefault();
  if(el.dataset.stop) ev.stopPropagation();
  runAction(el.dataset.act, el.dataset, el, ev);
});
document.addEventListener('change', ev=>{
  const el = ev.target.closest('[data-change]');
  if(!el) return;
  runAction(el.dataset.change, el.dataset, el, ev);
});
document.addEventListener('input', ev=>{
  const el = ev.target.closest('[data-input]');
  if(!el) return;
  runAction(el.dataset.input, el.dataset, el, ev);
});
/* Overlay: klik latar & tombol Escape menutup modal */
document.addEventListener('keydown', ev=>{
  if(ev.key==='Escape' && $('#overlay').classList.contains('show')) closeModal();
});
document.getElementById('overlay').addEventListener('click', ev=>{
  if(ev.target && ev.target.id==='overlay') closeModal();
});
/* Jebakan fokus sederhana di dalam modal */
document.addEventListener('keydown', ev=>{
  if(ev.key!=='Tab') return;
  const overlay = $('#overlay');
  if(!overlay.classList.contains('show')) return;
  const f = $$('#modal button, #modal input, #modal select, #modal textarea, #modal a[href]').filter(el=>!el.disabled && el.offsetParent!==null);
  if(!f.length) return;
  const first = f[0], last = f[f.length-1];
  if(ev.shiftKey && document.activeElement===first){ ev.preventDefault(); last.focus(); }
  else if(!ev.shiftKey && document.activeElement===last){ ev.preventDefault(); first.focus(); }
});
/* Pencarian global */
const searchEl = document.getElementById('globalSearch');
if(searchEl){
  searchEl.addEventListener('keydown', e=>{ if(e.key==='Enter') globalSearchSubmit(e.target.value); });
}
