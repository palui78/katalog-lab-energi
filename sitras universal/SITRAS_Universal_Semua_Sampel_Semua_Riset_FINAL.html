<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SITRAS Universal - Sistem Ketertelusuran Sampel dan Penelitian Laboratorium</title>
<meta name="description" content="SITRAS Universal - sistem ketertelusuran sampel dan penelitian laboratorium untuk semua jenis sampel dan semua bidang riset, selaras ISO/IEC 17025. Aplikasi satu berkas, berjalan langsung di peramban.">
<meta name="application-name" content="SITRAS Universal">
<meta name="theme-color" content="#2e5d3e">
<meta name="color-scheme" content="light">
<meta name="referrer" content="strict-origin-when-cross-origin">
<!-- Favicon inline (data URI) agar tidak ada permintaan /favicon.ico saat di-host. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%232e5d3e'/%3E%3Cpath d='M9 4h6M10 4v6.5L5.9 17.4a1.8 1.8 0 0 0 1.6 2.6h9a1.8 1.8 0 0 0 1.6-2.6L14 10.5V4M7.6 14.5h8.8' fill='none' stroke='%23f3efe6' stroke-width='1.7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   SITRAS UNIVERSAL - GAYA VISUAL
   Identitas visual dipertahankan dari SITRAS v1 (paper/moss/amber),
   dengan tambahan komponen untuk proyek, master data, dan wizard.
   ============================================================ */
:root{
  --paper:#f3efe6; --paper2:#faf7f0; --card:#fffdf8; --ink:#1b201b; --ink2:#454b43; --muted:#7c8175;
  --line:#ddd6c6; --line2:#e9e3d6;
  --moss:#2e5d3e; --moss-d:#22472f; --moss-l:#dcebdf;
  --amber:#bb7a2f; --amber-l:#f3e6cd; --amber-d:#8a5a1f;
  --terra:#a8432e; --terra-l:#f1ddd6;
  --slate:#3a5170; --slate-l:#dde3ee;
  --shadow:0 1px 2px rgba(30,40,25,.06), 0 8px 24px rgba(30,40,25,.06);
  --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"IBM Plex Sans",system-ui,sans-serif; color:var(--ink);
  background:
    radial-gradient(1200px 600px at 110% -10%, rgba(187,122,47,.07), transparent 60%),
    radial-gradient(1000px 500px at -10% 110%, rgba(46,93,62,.08), transparent 55%),
    var(--paper);
  background-attachment:fixed;
  font-size:14.5px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
.serif{font-family:"IBM Plex Serif",Georgia,serif}
.micro{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted)}
a{color:var(--moss)}
:focus-visible{outline:2px solid var(--moss); outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ---------- Header ---------- */
header.top{
  position:sticky; top:0; z-index:40;
  background:linear-gradient(180deg, rgba(250,247,240,.96), rgba(243,239,230,.92));
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.top-inner{max-width:1280px; margin:0 auto; padding:14px 20px; display:flex; align-items:center; gap:14px; flex-wrap:wrap}
.brand{display:flex; align-items:center; gap:13px}
.logo{
  width:42px; height:42px; border-radius:11px; flex:0 0 auto;
  background:linear-gradient(145deg,var(--moss),var(--moss-d));
  display:grid; place-items:center; color:#f3efe6; box-shadow:var(--shadow); position:relative; overflow:hidden;
}
.logo svg{width:26px; height:26px}
.logo img{width:100%;height:100%;object-fit:cover;border-radius:11px}
.brand h1{font-family:"IBM Plex Serif",serif; font-size:19px; margin:0; letter-spacing:-.01em}
.brand .sub{font-size:11px; color:var(--muted); margin-top:1px}
.spacer{flex:1}
.search-wrap{position:relative}
.search-wrap input{
  font-family:"IBM Plex Mono",monospace; font-size:12.5px; width:230px; max-width:46vw;
  padding:9px 12px 9px 32px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--ink);
}
.search-wrap input:focus{outline:none; border-color:var(--moss); box-shadow:0 0 0 3px var(--moss-l)}
.search-wrap svg{position:absolute; left:10px; top:9px; width:15px; height:15px; color:var(--muted)}
.projpick{display:flex; align-items:center; gap:7px; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:4px 9px 4px 11px}
.projpick .micro{white-space:nowrap}
.projpick select{width:auto; min-width:160px; max-width:34vw; border:none; background:transparent; padding:5px 2px; font-size:12.5px; font-weight:600; font-family:"IBM Plex Mono",monospace}
.projpick select:focus{outline:none; box-shadow:none; background:transparent}
.btn{
  font-family:"IBM Plex Sans",sans-serif; font-size:13px; font-weight:600; cursor:pointer;
  padding:9px 14px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--ink);
  display:inline-flex; align-items:center; gap:7px; transition:.12s; white-space:nowrap;
}
.btn:hover{border-color:var(--moss); color:var(--moss)}
.btn svg{width:15px; height:15px; flex:0 0 auto}
.btn.pri{background:linear-gradient(145deg,var(--moss),var(--moss-d)); color:#f6f3ec; border-color:var(--moss-d)}
.btn.pri:hover{filter:brightness(1.07); color:#fff}
.btn.amber{background:linear-gradient(145deg,var(--amber),var(--amber-d)); color:#fdf6ea; border-color:var(--amber-d)}
.btn.amber:hover{filter:brightness(1.06); color:#fff}
.btn.ghost{background:transparent}
.btn.danger{color:var(--terra); border-color:var(--terra-l)}
.btn.danger:hover{background:var(--terra-l); border-color:var(--terra)}
.btn.sm{padding:6px 10px; font-size:12px}
.btn:disabled{opacity:.45; cursor:not-allowed}

/* ---------- Nav ---------- */
nav.tabs{max-width:1280px; margin:0 auto; padding:0 12px; display:flex; gap:2px; overflow-x:auto}
nav.tabs button{
  font-family:"IBM Plex Sans",sans-serif; font-size:13px; font-weight:600; cursor:pointer;
  padding:11px 13px; border:none; background:transparent; color:var(--ink2); border-bottom:2.5px solid transparent;
  display:inline-flex; align-items:center; gap:7px; white-space:nowrap; transition:.12s;
}
nav.tabs button:hover{color:var(--moss)}
nav.tabs button.active{color:var(--moss); border-bottom-color:var(--moss)}
nav.tabs button svg{width:15px; height:15px}
nav.tabs button .cnt{font-family:"IBM Plex Mono",monospace; font-size:10px; background:var(--line2); color:var(--ink2); padding:1px 6px; border-radius:20px}
nav.tabs button.active .cnt{background:var(--moss-l); color:var(--moss-d)}

/* ---------- Layout ---------- */
main{max-width:1280px; margin:0 auto; padding:18px 20px 80px}
.crumb{display:flex; gap:7px; align-items:center; flex-wrap:wrap; font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--muted); margin-bottom:14px}
.crumb b{color:var(--ink2); font-weight:600}
.crumb .sep{opacity:.5}
.view-head{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:20px}
.view-head h2{font-family:"IBM Plex Serif",serif; font-size:24px; margin:0 0 3px; letter-spacing:-.015em}
.view-head p{margin:0; color:var(--muted); font-size:13px; max-width:70ch}
.row{display:flex; gap:14px; flex-wrap:wrap}
.col{flex:1; min-width:0}

/* ---------- Cards ---------- */
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow)}
.card.pad{padding:18px}
.card-h{padding:14px 18px; border-bottom:1px solid var(--line2); display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap}
.card-h h3{margin:0; font-family:"IBM Plex Serif",serif; font-size:16px}
.card-b{padding:18px}

/* stat tiles */
.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; margin-bottom:22px}
.stat{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px; position:relative; overflow:hidden}
.stat::before{content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--moss)}
.stat.amber::before{background:var(--amber)} .stat.slate::before{background:var(--slate)} .stat.terra::before{background:var(--terra)}
.stat .n{font-family:"IBM Plex Mono",monospace; font-size:30px; font-weight:600; line-height:1; margin:6px 0 4px}
.stat.mini .n{font-size:22px}
.stat .lbl{font-size:12px; color:var(--ink2); font-weight:600}
.stat.click{cursor:pointer}
.stat.click:hover{border-color:var(--moss)}

/* status pill */
.pill{display:inline-flex; align-items:center; gap:6px; font-family:"IBM Plex Mono",monospace; font-size:10.5px; font-weight:600; padding:3px 9px; border-radius:30px; letter-spacing:.02em; white-space:nowrap}
.pill .dot{width:6px; height:6px; border-radius:50%}
.tagline{display:flex; gap:6px; flex-wrap:wrap; align-items:center}

/* bar distribusi */
.distrow{margin-bottom:11px}
.distrow .dl{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;gap:10px}
.distrow .dl span:first-child{font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.distbar{height:7px;background:var(--line2);border-radius:6px;overflow:hidden}
.distbar > div{height:100%;background:linear-gradient(90deg,var(--moss),var(--amber));border-radius:6px}

/* table */
.tbl-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius); background:var(--card)}
table.data{width:100%; border-collapse:collapse; font-size:13px}
table.data th{font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); text-align:left; padding:11px 14px; border-bottom:1.5px solid var(--line); background:var(--paper2); position:sticky; top:0; z-index:1}
table.data td{padding:11px 14px; border-bottom:1px solid var(--line2); vertical-align:middle}
table.data tr:last-child td{border-bottom:none}
table.data tbody tr.clickable{cursor:pointer; transition:.1s}
table.data tbody tr.clickable:hover{background:var(--paper2)}
table.data tr.norow td{text-align:center; color:var(--muted); padding:34px; cursor:default}
table.data tr.norow:hover{background:transparent}
.code-cell{font-family:"IBM Plex Mono",monospace; font-weight:600; color:var(--moss-d)}
.alias{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--amber-d)}
.subtle{font-size:11px;color:var(--muted)}

/* forms */
.field{margin-bottom:15px}
.field label{display:block; font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink2); margin-bottom:6px; font-weight:600}
.field label .req{color:var(--terra)}
input[type=text], input[type=number], input[type=date], input[type=time], input[type=datetime-local], input[type=password], input[type=url], select, textarea{
  width:100%; font-family:"IBM Plex Sans",sans-serif; font-size:13.5px; padding:9px 11px; border:1px solid var(--line); border-radius:8px; background:var(--paper2); color:var(--ink);
}
input.mono, select.mono, textarea.mono{font-family:"IBM Plex Mono",monospace}
input:focus, select:focus, textarea:focus{outline:none; border-color:var(--moss); box-shadow:0 0 0 3px var(--moss-l); background:#fff}
input.invalid, select.invalid, textarea.invalid{border-color:var(--terra); background:#fdf3f0}
textarea{resize:vertical; min-height:64px}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:0 14px}
.grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:0 14px}
.grid4{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:0 14px}
.hint{font-size:11.5px; color:var(--muted); margin-top:5px}
.errmsg{font-size:11.5px; color:var(--terra); margin-top:5px; font-weight:600; display:none}
.errmsg.show{display:block}
.chk{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--ink2); margin-bottom:8px}
.chk input{width:auto}
.code-preview{font-family:"IBM Plex Mono",monospace; font-weight:600; font-size:17px; color:var(--moss-d); background:var(--moss-l); border:1px dashed var(--moss); border-radius:8px; padding:11px 14px; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap}
.tip{display:inline-flex; align-items:center; justify-content:center; width:14px; height:14px; border-radius:50%; background:var(--line2); color:var(--ink2); font-size:9.5px; font-weight:700; cursor:help; vertical-align:1px; margin-left:4px; font-family:"IBM Plex Sans",sans-serif}

/* wizard / form bertahap */
.steps{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px}
.steps button{font-family:"IBM Plex Mono",monospace; font-size:11px; font-weight:600; cursor:pointer; padding:7px 12px; border-radius:30px; border:1px solid var(--line); background:var(--card); color:var(--ink2); white-space:nowrap}
.steps button.on{background:var(--moss); color:#fff; border-color:var(--moss-d)}
.steps button:hover{border-color:var(--moss)}
.step-pane{display:none}
.step-pane.on{display:block}

/* modal */
.overlay{position:fixed; inset:0; background:rgba(27,32,27,.5); backdrop-filter:blur(3px); z-index:60; display:none; align-items:flex-start; justify-content:center; padding:30px 16px; overflow-y:auto}
.overlay.show{display:flex}
.modal{background:var(--paper2); border:1px solid var(--line); border-radius:14px; max-width:760px; width:100%; box-shadow:0 20px 60px rgba(20,30,18,.3); animation:pop .18s ease}
.modal.wide{max-width:1040px}
@keyframes pop{from{transform:translateY(8px) scale(.99); opacity:0}to{transform:none; opacity:1}}
.modal-h{padding:16px 20px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:12px}
.modal-h h3{margin:0; font-family:"IBM Plex Serif",serif; font-size:18px}
.modal-b{padding:20px; max-height:70vh; overflow-y:auto}
.modal-f{padding:14px 20px; border-top:1px solid var(--line); display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap}
.x{cursor:pointer; border:none; background:transparent; color:var(--muted); padding:4px; border-radius:6px; display:grid; place-items:center}
.x:hover{background:var(--line2); color:var(--ink)}
.x svg{width:18px; height:18px}

/* detail */
.kv{display:grid; grid-template-columns:150px 1fr; gap:8px 14px; font-size:13.5px}
.kv dt{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); padding-top:2px}
.kv dd{margin:0; color:var(--ink); word-break:break-word}
.divider{height:1px; background:var(--line2); margin:16px 0}

/* qr */
.qrbox{display:grid; place-items:center; gap:10px}
.qr-render{background:#fff; padding:12px; border:1px solid var(--line); border-radius:10px; display:inline-block; line-height:0}
.qr-render img, .qr-render canvas{display:block}

/* timeline */
.tl{position:relative; padding-left:22px}
.tl::before{content:""; position:absolute; left:6px; top:4px; bottom:4px; width:2px; background:var(--line)}
.tl-item{position:relative; padding:0 0 16px}
.tl-item::before{content:""; position:absolute; left:-19px; top:4px; width:11px; height:11px; border-radius:50%; background:var(--card); border:2.5px solid var(--moss)}
.tl-item.amber::before{border-color:var(--amber)}
.tl-item.slate::before{border-color:var(--slate)}
.tl-item .when{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--muted)}
.tl-item .what{font-weight:600; font-size:13.5px}
.tl-item .who{font-size:12px; color:var(--ink2)}

/* trace tree */
.tree{font-family:"IBM Plex Sans",sans-serif}
.tnode{border:1px solid var(--line); border-radius:9px; background:var(--card); padding:9px 12px; display:inline-flex; align-items:center; gap:10px; box-shadow:var(--shadow); cursor:pointer; flex-wrap:wrap; text-align:left}
.tnode:hover{border-color:var(--moss)}
.tnode .tc{font-family:"IBM Plex Mono",monospace; font-weight:600; color:var(--moss-d); font-size:13px}
.tchildren{margin:8px 0 8px 26px; padding-left:18px; border-left:2px dashed var(--line)}
.trow{margin:8px 0; position:relative}

/* filter bar */
.filters{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px}
.filters select, .filters input{width:auto; min-width:140px; font-size:12.5px; padding:7px 10px}
.chiprow{display:flex; gap:6px; flex-wrap:wrap}
.chip{font-family:"IBM Plex Mono",monospace; font-size:11px; padding:4px 10px; border-radius:30px; border:1px solid var(--line); background:var(--card); cursor:pointer; color:var(--ink2)}
.chip.on{background:var(--moss); color:#fff; border-color:var(--moss-d)}

/* toast */
#toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--ink); color:var(--paper); padding:12px 18px; border-radius:10px; font-size:13.5px; font-weight:500; box-shadow:0 10px 30px rgba(0,0,0,.3); opacity:0; pointer-events:none; transition:.25s; z-index:90; display:flex; align-items:center; gap:9px; max-width:90vw}
#toast.show{opacity:1; transform:translateX(-50%)}
#toast svg{width:17px; height:17px; flex:0 0 auto}

/* empty state */
.empty{text-align:center; padding:50px 20px; color:var(--muted)}
.empty svg{width:46px; height:46px; opacity:.4; margin-bottom:12px}
.empty h3{font-family:"IBM Plex Serif",serif; color:var(--ink2); margin:0 0 6px}

/* iso / info table */
.iso-tbl{width:100%; border-collapse:collapse; font-size:13px}
.iso-tbl th, .iso-tbl td{text-align:left; padding:10px 12px; border-bottom:1px solid var(--line2); vertical-align:top}
.iso-tbl th{font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); background:var(--paper2)}
.iso-tbl td:first-child{font-family:"IBM Plex Mono",monospace; font-weight:600; color:var(--moss-d); white-space:nowrap}
.flowstep{display:flex; align-items:center; gap:0; flex-wrap:wrap; margin:6px 0 4px}
.flowstep .fs{font-family:"IBM Plex Mono",monospace; font-size:11.5px; font-weight:600; padding:7px 12px; border-radius:8px; background:var(--moss-l); color:var(--moss-d); border:1px solid var(--moss)}
.flowstep .ar{color:var(--muted); padding:0 6px; font-weight:700}
.callout{border-left:3px solid var(--amber); background:var(--amber-l); padding:12px 14px; border-radius:0 8px 8px 0; font-size:13px; margin:14px 0}
.callout.bad{border-color:var(--terra); background:var(--terra-l)}
.callout.good{border-color:var(--moss); background:var(--moss-l)}
.warn{border-left:3px solid var(--terra); background:var(--terra-l); padding:10px 12px; border-radius:0 8px 8px 0}

/* master data editor */
.md-nav{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px}
.md-nav button{font-family:"IBM Plex Sans",sans-serif; font-size:12.5px; font-weight:600; cursor:pointer; padding:8px 12px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--ink2)}
.md-nav button.on{background:var(--moss); color:#fff; border-color:var(--moss-d)}
.md-nav button:hover{border-color:var(--moss)}
.off-row{opacity:.55}
.paramrow{display:grid; grid-template-columns:1.1fr 1fr .8fr .8fr auto; gap:8px; align-items:end; margin-bottom:8px}
.paramrow input, .paramrow select{font-size:12.5px; padding:7px 9px}

/* print labels */
#print-area{display:none}
body.printing{background:#fff}
@media print{
  html, body{background:#fff !important; -webkit-print-color-adjust:exact; print-color-adjust:exact}
  body.printing > *{ display:none !important; }
  body.printing #print-area{ display:block !important; }
  #print-area, #print-area *{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  #print-area.sheet{ padding:8mm; }
  @page{ size:A4 portrait; margin:8mm; }
  #print-area.thermal{ padding:0; width:40mm; margin:0; }
}
/* --- label A4 (grid) --- */
.lbl-grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:6mm}
.lbl-a4{border:1.2px solid #1b201b; border-radius:3mm; padding:3mm; display:flex; gap:3mm; align-items:center; break-inside:avoid; background:#fff; color:#000}
.lbl-a4 .qh{flex:0 0 auto}
.lbl-a4 .qt{font-family:"IBM Plex Mono",monospace; min-width:0}
.lbl-a4 .qt .lc{font-weight:600; font-size:11px; word-break:break-all}
.lbl-a4 .qt .la{font-size:9px; color:#b86a1f}
.lbl-a4 .qt .ld{font-size:8.5px; color:#333; margin-top:2px; line-height:1.35}
.lbl-a4 .qt .ls{font-size:7.5px; color:#555; margin-top:3px; letter-spacing:.04em; text-transform:uppercase}
/* --- label termal 40x40 mm --- */
.lbl-t{ width:40mm; height:40mm; box-sizing:border-box; overflow:hidden; background:#fff; color:#000;
        font-family:"IBM Plex Mono",monospace; padding:1.1mm 1.4mm 1.1mm; position:relative; margin:0;
        display:flex; flex-direction:column; align-items:center; justify-content:flex-start;

const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
/* escape untuk dipakai di dalam atribut data-* (sama dengan esc, dipisah agar niatnya jelas) */
const escAttr = s => esc(s);
const pad = (n,l)=>String(n).padStart(l,'0');
const uid = p => p+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const todayISO = ()=> new Date().toISOString().slice(0,10);
const nowISO = ()=> new Date().toISOString();
const nowLocal = ()=>{ const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,16); };
const hasOwn = (obj,key)=>obj!=null && Object.prototype.hasOwnProperty.call(obj,key);
const trim = v => String(v==null?'':v).trim();
const arr = v => Array.isArray(v)? v : [];
function datetimeLocalValue(s){
  if(!s) return nowLocal();
  const d = new Date(s);
  if(isNaN(d.getTime())) return nowLocal();
  d.setMinutes(d.getMinutes()-d.getTimezoneOffset());
  return d.toISOString().slice(0,16);
}
function fmtDate(s){ if(!s) return '-'; const d=new Date(s); if(isNaN(d.getTime())) return String(s); return d.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtDT(s){ if(!s) return '-'; const d=new Date(s); if(isNaN(d.getTime())) return String(s); return d.toLocaleString('id-ID',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
/* Angka: menerima titik maupun koma desimal (Modul 11 - normalisasi desimal). */
function num(v){
  if(typeof v==='number') return isFinite(v)? v : 0;
  let t = trim(v);
  if(!t) return 0;
  t = t.replace(/\s/g,'');
  if(t.indexOf(',')>=0 && t.indexOf('.')>=0){
    t = (t.lastIndexOf(',') > t.lastIndexOf('.')) ? t.replace(/\./g,'').replace(',','.') : t.replace(/,/g,'');
  }else if(t.indexOf(',')>=0){
    t = t.replace(',', '.');
  }
  const n = parseFloat(t);
  return isNaN(n)? 0 : n;
}
function numOrBlank(v){ const t=trim(v); return t===''? '' : num(t); }
function fmtNum(n){
  if(n==null||n==='') return '-';
  const x=Number(n);
  if(!isFinite(x)) return String(n);
  return Number.isInteger(x)? x.toLocaleString('id-ID') : x.toLocaleString('id-ID',{maximumFractionDigits:4});
}
function slugCode(v, fallback){
  const t = trim(v).toUpperCase().replace(/[^A-Z0-9._-]/g,'');
  return t || (fallback||'');
}
function isSafeUrl(u){
  const t = trim(u);
  if(!t) return false;
  return /^(https?:\/\/|\/|\.\/|#|data:image\/)/i.test(t) && !/^javascript:/i.test(t);
}
function toast(msg, kind='ok'){
  const t=$('#toast'); if(!t) return;
  const ic = kind==='ok'
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="#9fe0ab" stroke-width="2.5"><path d="M20 6 9 17l-5-5"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="#f0b3a6" stroke-width="2.5"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>';
  t.innerHTML = ic+'<span>'+esc(msg)+'</span>';
  t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),3200);
}
function statusStyle(name, list){
  const item = arr(list).find(x=>x.name===name || x.code===name);
  if(item && STATUS_PALETTE[item.color]) return STATUS_PALETTE[item.color];
  return STATUS_FALLBACK;
}
function pill(status, list){
  const s = statusStyle(status, list);
  return `<span class="pill" style="color:${s.c};background:${s.b}"><span class="dot" style="background:${s.c}"></span>${esc(status||'-')}</span>`;
}
/* Bangun atribut data-* yang aman untuk event delegation (tidak ada onclick string). */
function attrs(map){
  return Object.entries(map||{}).filter(([,v])=>v!=null && v!=='')
    .map(([k,v])=>`data-${k}="${escAttr(v)}"`).join(' ');
}
function selOptions(items, selected, opt={}){
  const out = [];
  if(opt.blank) out.push(`<option value="">${esc(opt.blank)}</option>`);
  arr(items).forEach(it=>{
    const value = it.value!=null? it.value : it;
    const label = it.label!=null? it.label : it;
    out.push(`<option value="${escAttr(value)}"${String(value)===String(selected==null?'':selected)?' selected':''}>${esc(label)}</option>`);
  });
  return out.join('');
}

/* ============================================================
   2. STORAGE (window.storage -> localStorage -> memori)
   ============================================================ */
function hasLocalStore(){
  try{
    const s = window.localStorage;
    if(!s) return false;
    const probe='__sitras_probe__'; s.setItem(probe,'1'); s.removeItem(probe);
    return true;
  }catch(e){ return false; }
}
const Store = {
  mem:{},
  async get(key){
    try{
      if(window.storage && window.storage.get){
        const r = await window.storage.get(key);
        if(r && r.value!=null) return JSON.parse(r.value);
      }
    }catch(e){/* lanjut ke localStorage */}
    try{
      if(hasLocalStore()){
        const raw = window.localStorage.getItem(key);
        if(raw!=null) return JSON.parse(raw);
      }
    }catch(e){
      /* data korup / storage mati -> jangan hentikan aplikasi */
      console.warn('[SITRAS] Data pada kunci '+key+' tidak dapat dibaca, memakai cadangan memori.', e);
    }
    return (key in this.mem)? this.mem[key] : null;
  },
  async set(key,val){
    this.mem[key]=val;
    try{ if(window.storage && window.storage.set) await window.storage.set(key, JSON.stringify(val)); }catch(e){}
    try{ if(hasLocalStore()) window.localStorage.setItem(key, JSON.stringify(val)); }
    catch(e){ console.warn('[SITRAS] Gagal menulis ke localStorage (mungkin penuh).', e); }
    return val;
  },
  async raw(key){
    try{ if(hasLocalStore()) return window.localStorage.getItem(key); }catch(e){}
    return null;
  }
};

const MD_KEYS = ['materials','sampleTypes','testCategories','testMethods','units','storageConditions','locations','sampleStatuses','testStatuses','processTemplates','customFieldDefinitions'];
const MD_LABELS = {
  materials:'Material / komoditas', sampleTypes:'Tipe sampel', testCategories:'Kategori pengujian',
  testMethods:'Metode / standar', units:'Satuan', storageConditions:'Kondisi penyimpanan',
  locations:'Lokasi penyimpanan', sampleStatuses:'Status sampel', testStatuses:'Status pengujian',

/* Sebagian kelompok master data peka huruf besar/kecil (mis. satuan: mL, kg, uL). */
const CASE_SENSITIVE_MD = ['units'];
function mdCodeFor(key, raw, fallback){
  const t = trim(raw);
  if(CASE_SENSITIVE_MD.indexOf(key)>=0){
    const c = t.replace(/[^A-Za-z0-9._%/-]/g,'');
    return c || trim(fallback) || t;
  }
  return slugCode(t, fallback);
}
function mdItem(code, name, desc, extra){
  const now = nowISO();
  return Object.assign({
    id: uid('md'), code: slugCode(code, code), name: name||code, desc: desc||'',
    active:true, order:0, createdAt:now, updatedAt:now
  }, extra||{});
}
function defaultMasterData(){
  const md = {};
  MD_KEYS.forEach(k=> md[k]=[]);
  DEFAULT_MATERIALS.forEach(([c,n,d],i)=> md.materials.push(mdItem(c,n,d,{order:i})));
  DEFAULT_SAMPLE_TYPES.forEach(([c,n,d],i)=> md.sampleTypes.push(mdItem(c,n,d,{order:i})));
  DEFAULT_TEST_CATEGORIES.forEach((c,i)=> md.testCategories.push(mdItem(c.code,c.name,c.desc,{order:i, params:c.params||[], isProcess:!!c.process})));
  DEFAULT_METHODS.forEach(([c,n,d],i)=> md.testMethods.push(mdItem(c,n,d,{order:i})));
  DEFAULT_UNITS.forEach(([c,n,f],i)=> md.units.push(Object.assign(mdItem(c,n,'',{order:i, family:f, symbol:c}), {code:c})));
  DEFAULT_STORAGE_CONDITIONS.forEach(([c,n,d],i)=> md.storageConditions.push(mdItem(c,n,d,{order:i})));
  DEFAULT_LOCATIONS.forEach(([c,n,d],i)=> md.locations.push(mdItem(c,n,d,{order:i})));
  DEFAULT_SAMPLE_STATUSES.forEach(([c,n,d,col],i)=> md.sampleStatuses.push(mdItem(c,n,d,{order:i, color:col})));
  DEFAULT_TEST_STATUSES.forEach(([c,n,d,col],i)=> md.testStatuses.push(mdItem(c,n,d,{order:i, color:col})));
  DEFAULT_PROCESS_TEMPLATES.forEach((t,i)=> md.processTemplates.push(mdItem(t.code,t.name,t.desc,{order:i, vars:t.vars||''})));
  return md;
}
function md(key){ return arr(DB.masterData && DB.masterData[key]); }
function mdActive(key){ return md(key).filter(x=>x.active!==false).sort((a,b)=>(a.order||0)-(b.order||0)||String(a.name).localeCompare(String(b.name))); }
function mdAll(key){ return md(key).slice().sort((a,b)=>(a.order||0)-(b.order||0)||String(a.name).localeCompare(String(b.name))); }
function mdFind(key, codeOrId){
  const t = trim(codeOrId); if(!t) return null;
  const list = md(key);
  return list.find(x=>x.id===t) || list.find(x=>String(x.code).toUpperCase()===t.toUpperCase()) || list.find(x=>String(x.name).toLowerCase()===t.toLowerCase()) || null;
}
function mdName(key, codeOrId, fallback){
  const it = mdFind(key, codeOrId);
  if(it) return it.name;
  return fallback!=null? fallback : (trim(codeOrId)||'-');
}
function mdCode(key, codeOrId){
  const it = mdFind(key, codeOrId);
  return it? it.code : slugCode(codeOrId,'');
}
/* Menambah master data secara diam-diam bila nilai impor/migrasi belum terdaftar. */
function mdEnsure(key, code, name, extra){
  const c = mdCodeFor(key, code); if(!c) return null;
  const found = mdFind(key, c);
  if(found) return found;
  const item = Object.assign(mdItem(c, name||c, (extra&&extra.desc)||'', Object.assign({order: md(key).length}, extra||{})), {code:c});
  DB.masterData[key].push(item);
  return item;
}
function mdOptions(key, selected, opt){
  const list = mdActive(key);
  const sel = trim(selected);
  /* Nilai lama yang sudah nonaktif tetap ditampilkan agar data tidak berubah diam-diam. */
  if(sel && !list.some(x=>x.code===sel || x.id===sel)){
    const legacy = mdFind(key, sel);
    if(legacy) list.push(legacy);
    else list.push({code:sel, name:sel+' (tidak terdaftar)'});
  }
  return selOptions(list.map(x=>({value:x.code, label:x.code+' - '+x.name})), sel, opt||{});
}
function unitFamily(code){
  const it = mdFind('units', code);
  if(it && it.family) return it.family;
  const f = UNIT_FACTORS[trim(code)];
  return f? f.family : '';
}
/* Konversi jumlah antar satuan. Mengembalikan null bila tidak kompatibel. */
function convertQty(value, fromUnit, toUnit){
  const v = num(value);
  const a = trim(fromUnit), b = trim(toUnit);
  if(!a || !b || a===b) return v;
  const fa = UNIT_FACTORS[a], fb = UNIT_FACTORS[b];
  if(fa && fb && fa.family===fb.family) return v * fa.f / fb.f;
  const cfa = (mdFind('units',a)||{}), cfb = (mdFind('units',b)||{});
  if(cfa.family && cfa.family===cfb.family && num(cfa.factor)>0 && num(cfb.factor)>0){
    return v * num(cfa.factor) / num(cfb.factor);
  }
  return null;
}

function cfgDefaults(cfg){
  const c = (cfg && typeof cfg==='object') ? Object.assign({}, cfg) : {};
  const def = (k,v)=>{ if(!hasOwn(c,k) || c[k]===undefined || c[k]===null || c[k]==='') c[k]=v; };
  def('origin','');
  def('labName', DEFAULT_LAB_NAME);
  def('labSub',  DEFAULT_LAB_SUB);
  def('labCode','');
  def('institution','');
  def('address','');
  def('logoUrl','');
  def('timezone', (Intl.DateTimeFormat().resolvedOptions().timeZone)||'Asia/Makassar');
  def('dateFormat','dd-MMM-yyyy');
  def('numberFormat','id-ID');
  def('activeUser','');
  def('defaultProject','');
  def('codeTemplate', DEFAULT_CODE_TEMPLATE);
  def('seqPad', 3);
  def('seqScope','project-material-type-year');
  if(!hasOwn(c,'qrUrl')) c.qrUrl='';
  if(!hasOwn(c,'sheetBI')) c.sheetBI='';
  if(!hasOwn(c,'sheetUJI')) c.sheetUJI='';
  if(!hasOwn(c,'sheetLOG')) c.sheetLOG='';
  if(!hasOwn(c,'csvAutoPull')) c.csvAutoPull=false;
  if(!hasOwn(c,'csvSourceMigrated')) c.csvSourceMigrated=false;
  /* Migrasi v1 -> v2: sumber CSV warisan tidak lagi ditarik otomatis. URL milik
     pengguna TIDAK dihapus (tetap tersimpan lokal dan dapat dipakai manual). */
  if(!c.csvSourceMigrated && trim(c.sheetBI).indexOf(LEGACY_CSV_HOST_HINT)>=0){
    c.csvAutoPull = false;
    c.csvSourceMigrated = true;
  }
  def('githubBranch', DEFAULT_GITHUB_BRANCH);
  def('githubPath', DEFAULT_GITHUB_PATH);
  if(!hasOwn(c,'githubOwner')) c.githubOwner='';
  if(!hasOwn(c,'githubRepo')) c.githubRepo='';
  if(!hasOwn(c,'githubToken')) c.githubToken='';
  if(!hasOwn(c,'githubAutoSync')) c.githubAutoSync=false;
  if(!hasOwn(c,'githubAutoPull')) c.githubAutoPull=false;
  if(!hasOwn(c,'sheetWriteUrl')) c.sheetWriteUrl='';
  if(!hasOwn(c,'sheetWriteToken')) c.sheetWriteToken='';
  if(!hasOwn(c,'sheetWriteAutoSync')) c.sheetWriteAutoSync=false;
  if(!['thermal','a4'].includes(c.labelModeDefault)) c.labelModeDefault='thermal';
  if(!Number.isFinite(Number(c.labelCopiesDefault))) c.labelCopiesDefault=1;
  if(!hasOwn(c,'labelAutoPrint')) c.labelAutoPrint=false;
  def('labelFooter','');
  if(!hasOwn(c,'lowStockPct')) c.lowStockPct=10;
  if(!(trim(c.githubOwner) && trim(c.githubRepo))){ c.githubAutoPull=false; c.githubAutoSync=false; }
  if(!trim(c.sheetWriteUrl)) c.sheetWriteAutoSync=false;
  return c;
}

/* ---------- MIGRASI v1 -> v2 ----------
   Prinsip:
   - Tidak menghapus apa pun. ID sampel lama dipertahankan apa adanya.
   - Konstanta lama (MATERIALS/TYPES/TEST_CATS/STORAGE_COND) menjadi master data.
   - Semua sampel/uji/log tanpa projectId ditautkan ke proyek "Data Lama".
   - Struktur lama dicadangkan ke kunci sitras:backup:v1 sebelum ditulis ulang.
   - Tidak dijalankan dua kali (dijaga oleh sitras:meta.version). */
const LEGACY_MATERIALS = { SST:'Shorea stenoptera (tengkawang)', TKW:'Tengkawang (umum)' };
const LEGACY_TYPES = {
  RAW:'Biomassa mentah (as-received)', SS:'Subsampel preparasi', BO:'Bio-oil (produk cair)',
  BC:'Biochar (produk padat)', AQ:'Fasa air / aqueous', NCG:'Gas non-kondensabel', OTH:'Lainnya'
};
const LEGACY_TYPE_MAP = { RAW:'RAW', SS:'SS', BO:'PCR', BC:'PPD', AQ:'PCR', NCG:'PGS', OTH:'LNN' };
const LEGACY_TEST_CATS = {
  'Proksimat':'PRX', 'Ultimat (CHNS-O)':'ULT', 'FTIR-ATR':'FTIR',
  'Pirolisis (RSM-CCD run)':'PYR', 'Pyrolysis (RSM-CCD run)':'PYR', 'Pyrolysis / Pirolisis (RSM-CCD run)':'PYR',
  'Nilai kalor (HHV)':'HHV', 'Kadar air':'KDA', 'Densitas / bulk density':'DNS',
  'GC-MS bio-oil':'GCMS', 'Bilangan asam':'ACD', 'Lainnya':'CST'
};
const LEGACY_STORAGE = ['Suhu ruang','Desikator','Lemari asam','Kulkas 4 C','Freezer -20 C','Botol gelap','Vakum / kedap'];
const LEGACY_PROJECT_ID = 'prj-legacy-default';

function migrateLegacyToV2(legacy){
  const report = {samples:0, tests:0, movements:0, materials:0, types:0, cats:0, notes:[]};
  const now = nowISO();
  const next = emptyDb();

  /* Konfigurasi lama dipertahankan, hanya ditambah default baru. */
  next.cfg = cfgDefaults(Object.assign({}, legacy.cfg||{}));
  /* Instalasi lama tetap memakai pola kode lama supaya nomor urut berlanjut. */
  next.cfg.codeTemplate = LEGACY_CODE_TEMPLATE;
  next.cfg.seqScope = 'material-type-year';
  if(!trim(next.cfg.labName) || next.cfg.labName===DEFAULT_LAB_NAME){
    next.cfg.labName = trim((legacy.cfg||{}).labName) || 'Lab Energi Terbarukan POLIBAN';
  }
  if(!trim(next.cfg.labSub) || next.cfg.labSub===DEFAULT_LAB_SUB){
    next.cfg.labSub = trim((legacy.cfg||{}).labSub) || DEFAULT_LAB_SUB;
  }
  if(!trim(next.cfg.labelFooter)) next.cfg.labelFooter = trim((legacy.cfg||{}).labelFooter) || '';

  /* --- Master data dari konstanta lama --- */
  const mdRef = next.masterData;
  const pushMd = (key, code, name, desc, extra)=>{
    const exist = mdRef[key].find(x=>String(x.code).toUpperCase()===String(code).toUpperCase());
    if(exist) return exist;
    const item = mdItem(code, name, desc, Object.assign({order: mdRef[key].length}, extra||{}));
    mdRef[key].push(item); return item;
  };
  Object.entries(LEGACY_MATERIALS).forEach(([c,n])=>{ pushMd('materials', c, n, 'Dimigrasikan dari SITRAS v1'); report.materials++; });
  Object.entries(LEGACY_TYPES).forEach(([c,n])=>{
    if(!mdRef.sampleTypes.some(x=>x.code===c)){ pushMd('sampleTypes', c, n, 'Dimigrasikan dari SITRAS v1'); report.types++; }
  });
  LEGACY_STORAGE.forEach(n=>{
    if(!mdRef.storageConditions.some(x=>x.name===n)) pushMd('storageConditions', slugCode(n.slice(0,4),'SC'), n, 'Dimigrasikan dari SITRAS v1');
  });
  /* Kategori uji lama disimpan sebagai kategori tersendiri agar nama pada rekaman tetap sama. */
  Object.keys(LEGACY_TEST_CATS).forEach(nameOld=>{
    const target = DEFAULT_TEST_CATEGORIES.find(c=>c.code===LEGACY_TEST_CATS[nameOld]);
    if(!mdRef.testCategories.some(x=>x.name===nameOld)){
      pushMd('testCategories', slugCode('L'+(LEGACY_TEST_CATS[nameOld]||'CST'),'LCST')+'-'+(mdRef.testCategories.length+1), nameOld,
        'Kategori warisan SITRAS v1', {params: target? (target.params||[]) : [], isProcess: !!(target&&target.process), legacy:true});
      report.cats++;
    }
  });

  /* --- Proyek default untuk seluruh data lama --- */
  const legacySamples = arr(legacy.samples);
  const years = legacySamples.map(s=>String(s.regDate||'').slice(0,4)).filter(Boolean).sort();
  const project = {
    id: LEGACY_PROJECT_ID,
    code: 'LAMA',
    title: 'Data Lama / Belum Dikelompokkan',
    shortName: 'Data Lama',
    lead: trim((legacy.cfg||{}).activeUser) || '',
    members:'', institution: trim(next.cfg.institution), lab: trim(next.cfg.labName),
    funding:'', contractNo:'',
    year: years.length? years[0] : String(new Date().getFullYear()),
    dateStart: years.length? (legacySamples.map(s=>s.regDate).filter(Boolean).sort()[0]||'') : '',
    dateEnd:'', status:'Aktif', field:'', objective:'',
    description:'Proyek otomatis hasil migrasi SITRAS v1. Silakan pindahkan sampel ke proyek yang sesuai.',
    keywords:'migrasi, sitras-v1', notes:'', archived:false,
    createdAt: now, updatedAt: now
  };
  next.projects.push(project);

  /* --- Sampel --- */
  legacySamples.forEach(old=>{
    const s = Object.assign({}, old);
    s.projectId = trim(s.projectId) || LEGACY_PROJECT_ID;
    s.material = trim(s.material);
    if(s.material && !mdRef.materials.some(x=>x.code===s.material)) pushMd('materials', s.material, s.material, 'Ditemukan pada data lama');
    s.type = trim(s.type);
    if(s.type && !mdRef.sampleTypes.some(x=>x.code===s.type)) pushMd('sampleTypes', s.type, s.type, 'Ditemukan pada data lama');
    if(s.storecond && !mdRef.storageConditions.some(x=>x.name===s.storecond)) pushMd('storageConditions', slugCode(String(s.storecond).slice(0,4),'SC'), s.storecond, 'Ditemukan pada data lama');
    if(s.loc && !mdRef.locations.some(x=>x.name===s.loc)) pushMd('locations', slugCode(String(s.loc).replace(/[^A-Za-z0-9]/g,'').slice(0,6),'LOC'), s.loc, 'Ditemukan pada data lama');
    if(s.status && !mdRef.sampleStatuses.some(x=>x.name===s.status)) pushMd('sampleStatuses', slugCode(String(s.status).slice(0,4),'ST'), s.status, 'Ditemukan pada data lama', {color:'muted'});
    if(s.unit && !mdRef.units.some(x=>x.code===s.unit)) pushMd('units', s.unit, s.unit, 'Ditemukan pada data lama', {family:''});
    /* Field baru dengan nilai kosong - tidak menimpa data lama */
    s.name = trim(s.name) || trim(s.alias) || '';
    s.relation = trim(s.relation) || (s.parent? 'Subsampel' : '');
    s.batch = trim(s.batch); s.replicate = trim(s.replicate);
    s.sampleDate = trim(s.sampleDate); s.samplingLoc = trim(s.samplingLoc) || trim(s.source);
    s.sampler = trim(s.sampler); s.samplingMethod = trim(s.samplingMethod);
    s.containers = s.containers==null? '' : s.containers;
    s.containerType = trim(s.containerType);
    s.expiryDate = trim(s.expiryDate);
    s.customFields = (s.customFields && typeof s.customFields==='object')? s.customFields : {};
    s.attachments = trim(s.attachments);
    s.archived = !!s.archived;
    s.createdAt = s.createdAt || now;
    s.updatedAt = s.updatedAt || s.createdAt;
    next.samples.push(s);
    report.samples++;
  });

  /* --- Pengujian --- */
  arr(legacy.tests).forEach(old=>{
    const t = Object.assign({}, old);
    if(!t.id) t.id = uid('test');
    const s = next.samples.find(x=>x.id===t.sampleCode);
    t.projectId = trim(t.projectId) || (s? s.projectId : LEGACY_PROJECT_ID);
    t.category = trim(t.category);
    if(t.category && !mdRef.testCategories.some(x=>x.name===t.category)) pushMd('testCategories', slugCode('C'+(mdRef.testCategories.length+1),'CX'), t.category, 'Ditemukan pada data lama', {params:[]});
    if(t.status && !mdRef.testStatuses.some(x=>x.name===t.status)) pushMd('testStatuses', slugCode(String(t.status).slice(0,4),'TS'), t.status, 'Ditemukan pada data lama', {color:'muted'});
    /* Parameter pirolisis lama (temp/rate/hold) dipindahkan ke paramValues dinamis. */
    const pv = (t.paramValues && typeof t.paramValues==='object')? Object.assign({}, t.paramValues) : {};
    if(trim(t.temp)!=='' && pv.suhu==null) pv.suhu = t.temp;
    if(trim(t.rate)!=='' && pv.laju==null) pv.laju = t.rate;
    if(trim(t.hold)!=='' && pv.tahan==null) pv.tahan = t.hold;
    t.paramValues = pv;
    t.testCode = trim(t.testCode);
    t.batch = trim(t.batch) || trim(t.runCode);
    t.replicate = trim(t.replicate);
    t.instrument = trim(t.instrument); t.assetNo = trim(t.assetNo);
    t.massUnit = trim(t.massUnit) || (s? trim(s.unit) : '');
    t.resultData = trim(t.resultData);
    t.nonconformity = trim(t.nonconformity);
    t.archived = !!t.archived;
    t.createdAt = t.createdAt || now;
    t.updatedAt = t.updatedAt || t.createdAt;
    next.tests.push(t);
    report.tests++;
  });

  /* --- Pergerakan --- */
  arr(legacy.movements).forEach(old=>{
    const m = Object.assign({}, old);
    if(!m.id) m.id = uid('mov');
    const s = next.samples.find(x=>x.id===m.sampleCode);
    m.projectId = trim(m.projectId) || (s? s.projectId : LEGACY_PROJECT_ID);
    m.receiver = trim(m.receiver);
    m.purpose  = trim(m.purpose) || trim(m.note);
    m.condition= trim(m.condition);
    m.qty = m.qty==null? '' : m.qty;
    m.unit = trim(m.unit) || (s? trim(s.unit) : '');
    m.createdAt = m.createdAt || m.datetime || now;
    m.actor = trim(m.actor) || trim(m.person);
    next.movements.push(m);
    report.movements++;
  });

  /* Statistik proyek */
  project.sampleCount = next.samples.length;
  project.testCount   = next.tests.length;

  next.auditLogs = arr(legacy.auditLogs);
  next.auditLogs.push({
    id: uid('log'), at: now, entity:'system', entityId:'migration', action:'migrate',
    summary:`Migrasi schema v${LEGACY_SCHEMA_VERSION} -> v${DB_SCHEMA_VERSION}: ${report.samples} sampel, ${report.tests} uji, ${report.movements} log`,
    before:'', after:'', user: trim(next.cfg.activeUser), reason:'Migrasi otomatis SITRAS Universal'
  });
  return {db: next, report};
}

async function loadDB(){
  const meta = (await Store.get(K.META)) || null;
  const version = meta && Number(meta.version) ? Number(meta.version) : 0;

  if(version >= DB_SCHEMA_VERSION){
    /* --- Sudah schema v2: muat apa adanya --- */
    DB.projects   = arr(await Store.get(K.P));
    DB.samples    = arr(await Store.get(K.S));
    DB.tests      = arr(await Store.get(K.T));
    DB.movements  = arr(await Store.get(K.M));
    DB.auditLogs  = arr(await Store.get(K.AL));
    const storedMd = await Store.get(K.MD);
    DB.masterData = normalizeMasterData(storedMd);
    DB.cfg        = cfgDefaults((await Store.get(K.CFG)) || {});
  }else{
    /* --- Belum ada data v2: cek data v1 --- */
    const legacy = {
      samples  : arr(await Store.get(K.S)),
      tests    : arr(await Store.get(K.T)),
      movements: arr(await Store.get(K.M)),
      cfg      : (await Store.get(K.CFG)) || {}
    };
    const hasLegacy = legacy.samples.length || legacy.tests.length || legacy.movements.length || Object.keys(legacy.cfg||{}).length;
    if(hasLegacy){
      /* Cadangkan struktur lama SEBELUM ditulis ulang. */
      await Store.set(K.BAK1, {schema:DB_SCHEMA, version:LEGACY_SCHEMA_VERSION, backedUpAt: nowISO(), data: legacy});
      const {db, report} = migrateLegacyToV2(legacy);
      DB = db;
      MIGRATION_REPORT = report;
      await persistAll({skipRemote:true});
      console.info('[SITRAS] Migrasi v1 -> v2 selesai.', report);
    }else{
      DB = emptyDb();
      await persistAll({skipRemote:true});
    }
  }
  await Store.set(K.META, {schema:DB_SCHEMA, version:DB_SCHEMA_VERSION, updatedAt: nowISO(), app:APP_NAME});

  /* Proyek aktif terakhir */
  ACTIVE_PROJECT = trim(DB.cfg.defaultProject);
  if(ACTIVE_PROJECT && !DB.projects.some(p=>p.id===ACTIVE_PROJECT)) ACTIVE_PROJECT='';

  /* Tarik otomatis bila dikonfigurasi (tidak wajib, aman saat offline). */
  try{
    if(csvAutoPullEnabled()){
      const ok = await pullFromCsvSources({manual:false, quiet:true, renderAfter:false});
      if(ok) return;
    }
    if(hasGitHubSource() && DB.cfg.githubAutoPull===true){
      await pullFromGitHub({manual:false, quiet:true, renderAfter:false});
    }else if(!hasAnyData() && hasSheetWriteTarget() && DB.cfg.sheetWriteAutoSync===true){
      await pullFromGoogleSheetsSync({manual:false, quiet:true, renderAfter:false, onlyWhenEmpty:true});
    }
  }catch(e){
    console.warn('[SITRAS] Sinkron awal dilewati (kemungkinan offline).', e);
  }
}
/* Pastikan struktur master data lengkap walau berkas lama tidak punya semua kunci. */
function normalizeMasterData(stored){
  const base = defaultMasterData();
  if(!stored || typeof stored!=='object') return base;
  const out = {};
  MD_KEYS.forEach(k=>{
    const list = arr(stored[k]);
    out[k] = list.length? list.map(x=>Object.assign({id:uid('md'), active:true, order:0}, x)) : base[k];
  });
  return out;
}

/* ---------- Penyimpanan bagian per bagian ---------- */
async function save(part, opts){
  opts = opts||{};
  const map = {P:[K.P,'projects'], S:[K.S,'samples'], T:[K.T,'tests'], M:[K.M,'movements'], MD:[K.MD,'masterData'], AL:[K.AL,'auditLogs'], CFG:[K.CFG,'cfg']};
  const parts = Array.isArray(part)? part : [part];
  for(const p of parts){
    const entry = map[p];
    if(entry) await Store.set(entry[0], DB[entry[1]]);
  }
  if(!opts.skipRemote){
    scheduleGitHubPush(opts.reason||'autosave');
    scheduleSheetPush(opts.reason||'autosave');
  }
}
async function persistAll(opts){
  await save(['P','S','T','M','MD','AL','CFG'], opts||{});
}
function hasAnyData(){
  return !!(DB.projects.length || DB.samples.length || DB.tests.length || DB.movements.length);
}

/* ============================================================
   4. AUDIT TRAIL (tidak dapat diedit; koreksi = log baru)
   ============================================================ */
function diffSummary(before, after){
  if(!before && after) return 'dibuat';
  if(before && !after) return 'dihapus';
  const keys = new Set([...Object.keys(before||{}), ...Object.keys(after||{})]);
  const changes = [];
  keys.forEach(k=>{
    if(['updatedAt','createdAt','qrData'].includes(k)) return;
    const a = before? before[k] : undefined;
    const b = after ? after[k]  : undefined;
    const sa = (a&&typeof a==='object')? JSON.stringify(a) : (a==null?'':String(a));
    const sb = (b&&typeof b==='object')? JSON.stringify(b) : (b==null?'':String(b));
    if(sa!==sb) changes.push(`${k}: "${sa.slice(0,60)}" -> "${sb.slice(0,60)}"`);
  });
  return changes.length? changes.join('; ') : 'tanpa perubahan nilai';
}
function snapshot(obj){
  if(!obj) return null;
  try{ return JSON.parse(JSON.stringify(obj)); }catch(e){ return null; }
}
function logAudit(entity, entityId, action, before, after, reason){
  const entry = {
    id: uid('log'),
    at: nowISO(),
    entity: String(entity||''),
    entityId: String(entityId||''),
    action: String(action||''),
    summary: diffSummary(before, after).slice(0,900),
    before: before? JSON.stringify(before).slice(0,1800) : '',
    after : after ? JSON.stringify(after).slice(0,1800)  : '',
    user  : trim(DB.cfg.activeUser),
    reason: trim(reason)
  };
  DB.auditLogs.push(entry);
  if(DB.auditLogs.length > AUDIT_LIMIT) DB.auditLogs = DB.auditLogs.slice(-AUDIT_LIMIT);
  return entry;
}

function fieldError(id, message){
  const input = document.getElementById(id);
  const box = document.getElementById('err_'+id);
  if(input) input.classList.add('invalid');
  if(box){ box.textContent = message; box.classList.add('show'); }
}
function clearFieldErrors(scope){
  const root = scope || document;
  $$('.invalid', root).forEach(el=>el.classList.remove('invalid'));
  $$('.errmsg.show', root).forEach(el=>{ el.classList.remove('show'); el.textContent=''; });
}
function showErrors(errors){
  clearFieldErrors();
  if(!errors.length) return true;
  errors.forEach(e=>{ if(e.field) fieldError(e.field, e.msg); });
  toast(errors[0].msg, 'err');
  const first = errors.find(e=>e.field);
  if(first){
    const el = document.getElementById(first.field);
    if(el && el.scrollIntoView){
      /* Buka tahap form yang memuat field bermasalah (form bertahap). */
      const pane = el.closest('.step-pane');
      if(pane && !pane.classList.contains('on')) openRegStepEl(pane);
      el.scrollIntoView({block:'center', behavior:'smooth'});
      try{ el.focus({preventScroll:true}); }catch(err){}
    }
  }
  return false;
}
/* Deteksi rantai induk melingkar: apakah candidateParent adalah keturunan dari sampleId? */
function isDescendant(sampleId, candidateParentId, overrideParent){
  if(!candidateParentId) return false;
  if(candidateParentId===sampleId) return true;
  const seen = new Set();
  let cur = candidateParentId;
  while(cur && !seen.has(cur)){
    seen.add(cur);
    if(cur===sampleId) return true;
    const node = DB.samples.find(x=>x.id===cur);
    if(!node) return false;
    cur = (overrideParent && overrideParent.id===node.id)? overrideParent.parent : node.parent;
  }
  return false;
}
function findCircularSamples(){
  const bad = [];
  DB.samples.forEach(s=>{
    const seen = new Set([s.id]);
    let cur = s.parent;
    while(cur){
      if(seen.has(cur)){ bad.push(s.id); break; }
      seen.add(cur);
      const n = DB.samples.find(x=>x.id===cur);
      cur = n? n.parent : '';
    }
  });
  return bad;
}
function findOrphanRecords(){
  const ids = new Set(DB.samples.map(s=>s.id));
  return {
    samples : DB.samples.filter(s=>s.parent && !ids.has(s.parent)).map(s=>s.id),
    tests   : DB.tests.filter(t=>!ids.has(t.sampleCode)).map(t=>t.id),
    movements: DB.movements.filter(m=>!ids.has(m.sampleCode)).map(m=>m.id)
  };
}

/* ============================================================
   4b. GENERATOR KODE FLEKSIBEL (Modul 4)
   ============================================================ */
const CODE_TOKENS = ['{PROJECT}','{MATERIAL}','{TYPE}','{ORIGIN}','{YYYY}','{YY}','{MM}','{DD}','{BATCH}','{RUN}','{REPLICATE}','{SEQ}'];
function codeTemplate(){ return trim(DB.cfg.codeTemplate) || DEFAULT_CODE_TEMPLATE; }
function seqPad(){ const n = parseInt(DB.cfg.seqPad,10); return (Number.isFinite(n)&&n>=1&&n<=8)? n : 3; }
function seqScope(){ return trim(DB.cfg.seqScope) || 'project-material-type-year'; }

function codeContext(ctx){
  const d = trim(ctx.date) || todayISO();
  const dt = new Date(d+'T00:00:00');
  const valid = !isNaN(dt.getTime());
  const project = ctx.projectId? DB.projects.find(p=>p.id===ctx.projectId) : null;
  return {
    PROJECT  : slugCode(project? project.code : (ctx.projectCode||''), ''),
    MATERIAL : slugCode(ctx.material,''),
    TYPE     : slugCode(ctx.type,''),
    ORIGIN   : slugCode(ctx.origin,''),
    YYYY     : valid? String(dt.getFullYear()) : d.slice(0,4),
    YY       : (valid? String(dt.getFullYear()) : d.slice(0,4)).slice(-2),
    MM       : valid? pad(dt.getMonth()+1,2) : d.slice(5,7),
    DD       : valid? pad(dt.getDate(),2)    : d.slice(8,10),
    BATCH    : slugCode(ctx.batch,''),
    RUN      : slugCode(ctx.run,''),
    REPLICATE: slugCode(ctx.replicate,'')
  };
}
/* Kunci ruang lingkup nomor urut. */
function seqKey(ctx){
  const c = codeContext(ctx);
  const scope = seqScope();
  const parts = [];
  if(scope==='global') return 'GLOBAL';
  if(scope.includes('project'))  parts.push('P:'+c.PROJECT);
  if(scope.includes('material')) parts.push('M:'+c.MATERIAL);
  if(scope.includes('type'))     parts.push('T:'+c.TYPE);
  if(scope.includes('year'))     parts.push('Y:'+c.YYYY);
  return parts.join('|') || 'GLOBAL';
}
function nextSeq(ctx){
  const key = seqKey(ctx);
  let n = 0;
  DB.samples.forEach(s=>{
    const sk = seqKey({projectId:s.projectId, material:s.material, type:s.type, origin:s.origin, date:s.regDate, batch:s.batch, run:s.run, replicate:s.replicate});
    if(sk===key) n++;
  });
  return n+1;
}
function renderCodeTemplate(tpl, ctx, seq){
  const c = codeContext(ctx);
  c.SEQ = pad(seq, seqPad());
  let out = String(tpl||DEFAULT_CODE_TEMPLATE);
  Object.keys(c).forEach(k=>{ out = out.split('{'+k+'}').join(c[k]); });
  out = out.replace(/\{[A-Z]+\}/g,'');            // token tak dikenal dibuang
  out = out.replace(/-{2,}/g,'-').replace(/^[-_.]+|[-_.]+$/g,'');   // rapikan pemisah kosong
  return out;
}
function genCode(ctx){
  let seq = nextSeq(ctx);
  let code = '';
  let guard = 0;
  do{
    code = renderCodeTemplate(codeTemplate(), ctx, seq);
    seq++; guard++;
  } while(code && DB.samples.some(s=>s.id===code) && guard<10000);
  return code || ('SMP-'+Date.now().toString(36).toUpperCase());
}

function activeProjects(){ return DB.projects.filter(p=>!p.archived && p.status!=='Diarsipkan'); }
function projectStats(id){

function scopedTests(){ return ACTIVE_PROJECT? DB.tests.filter(t=>t.projectId===ACTIVE_PROJECT) : DB.tests.slice(); }

function readProjectForm(existing){

  return Object.assign({}, existing||{}, {
    id: existing? existing.id : uid('prj'),

    title: g('p_title'),
    shortName: g('p_short'),
    lead: g('p_lead'),
    members: g('p_members'),
    institution: g('p_inst'),
    lab: g('p_lab'),
    funding: g('p_fund'),
    contractNo: g('p_contract'),
    year: g('p_year'),
    dateStart: g('p_start'),
    dateEnd: g('p_end'),
    status: g('p_status') || 'Perencanaan',
    field: g('p_field'),
    objective: g('p_objective'),
    description: g('p_desc'),

    notes: g('p_notes'),

    createdAt: existing? (existing.createdAt||now) : now,

  });

function validateProject(p, editingId){
  const errs = [];
  if(!p.code) errs.push({field:'p_code', msg:'Kode proyek wajib diisi (huruf/angka, mis. BIO26).'});
  else if(DB.projects.some(x=>x.id!==editingId && String(x.code).toUpperCase()===p.code.toUpperCase()))
    errs.push({field:'p_code', msg:'Kode proyek "'+p.code+'" sudah dipakai proyek lain.'});
  if(!p.title) errs.push({field:'p_title', msg:'Judul penelitian wajib diisi.'});
  if(!p.lead) errs.push({field:'p_lead', msg:'Ketua peneliti wajib diisi.'});
  if(p.dateStart && p.dateEnd && p.dateEnd < p.dateStart)
    errs.push({field:'p_end', msg:'Tanggal selesai tidak boleh mendahului tanggal mulai.'});
  if(p.year && !/^\d{4}$/.test(p.year)) errs.push({field:'p_year', msg:'Tahun harus 4 digit, mis. 2026.'});
  return errs;
}
async function saveProject(editingId){
  const existing = editingId? projectById(editingId) : null;
  const before = snapshot(existing);
  const p = readProjectForm(existing);
  if(!showErrors(validateProject(p, editingId||''))) return;
  if(existing) Object.assign(existing, p);
  else DB.projects.push(p);
  logAudit('project', p.id, existing?'update':'create', before, snapshot(p), '');
  await save(['P','AL']);
  closeModal();
  toast('Proyek '+p.code+' tersimpan');
  if(!ACTIVE_PROJECT && DB.projects.length===1){ ACTIVE_PROJECT = p.id; DB.cfg.defaultProject = p.id; await save('CFG',{skipRemote:true}); }
  render();
}
async function archiveProject(id, restore){
  const p = projectById(id); if(!p) return;
  const before = snapshot(p);
  p.archived = !restore;
  p.status = restore? 'Aktif' : 'Diarsipkan';
  p.updatedAt = nowISO();
  logAudit('project', id, restore?'restore':'archive', before, snapshot(p), '');
  await save(['P','AL']);
  toast(restore? 'Proyek dipulihkan' : 'Proyek diarsipkan');
  render();
}
async function deleteProject(id, force){
  const p = projectById(id); if(!p) return;
  const st = projectStats(id);
  if((st.samples || st.tests) && !force){
    toast('Proyek masih memiliki '+st.samples+' sampel dan '+st.tests+' pengujian.','err');
    return;
  }
  const before = snapshot(p);
  DB.projects = DB.projects.filter(x=>x.id!==id);
  if(force){
    /* Data terkait tidak dihapus; dipindahkan ke "tanpa proyek" agar tidak menjadi yatim. */
    DB.samples.forEach(s=>{ if(s.projectId===id) s.projectId=''; });
    DB.tests.forEach(t=>{ if(t.projectId===id) t.projectId=''; });
    DB.movements.forEach(m=>{ if(m.projectId===id) m.projectId=''; });
  }
  if(ACTIVE_PROJECT===id) ACTIVE_PROJECT='';
  if(DB.cfg.defaultProject===id) DB.cfg.defaultProject='';
  logAudit('project', id, 'delete', before, null, force?'hapus paksa - data dilepas dari proyek':'');
  await save(['P','S','T','M','CFG','AL']);
  closeModal();
  toast('Proyek '+p.code+' dihapus');
  render();
}
/* Pindahkan seluruh data satu proyek ke proyek lain. */
async function moveProjectData(fromId, toId){
  if(!fromId || !toId || fromId===toId){ toast('Pilih proyek tujuan yang berbeda','err'); return; }
  let n=0;
  DB.samples.forEach(s=>{ if(s.projectId===fromId){ s.projectId=toId; s.updatedAt=nowISO(); n++; } });
  DB.tests.forEach(t=>{ if(t.projectId===fromId) t.projectId=toId; });
  DB.movements.forEach(m=>{ if(m.projectId===fromId) m.projectId=toId; });
  logAudit('project', fromId, 'move-data', {to:toId}, {moved:n}, 'Pemindahan data antar proyek');
  await save(['S','T','M','AL']);
  toast(n+' sampel dipindahkan ke '+projectLabel(toId));
  render();
}

   7. MANAJEMEN SAMPEL (Modul 3)

function sampleById(id){ return DB.samples.find(s=>s.id===id) || null; }
function sampleDisplayName(s){
  if(!s) return '';
  return trim(s.name) || trim(s.alias) || mdName('materials', s.material, '') || s.id;

function sampleChildren(id){ return DB.samples.filter(s=>s.parent===id); }
function sampleTestCount(id){ return DB.tests.filter(t=>t.sampleCode===id).length; }
function sampleRoot(s){
  if(!s) return null;
  let node = s; const seen = new Set();
  while(node && node.parent && !seen.has(node.id)){
    seen.add(node.id);
    const p = sampleById(node.parent);
    if(!p) break;
    node = p;
  }
  return node;
}
function sampleAncestry(s){
  const chain = [];
  let node = s; const seen = new Set();
  while(node && !seen.has(node.id)){
    seen.add(node.id);
    chain.unshift(node);
    node = node.parent? sampleById(node.parent) : null;
  }
  return chain;
}
function lowStockThreshold(s){
  const pct = num(DB.cfg.lowStockPct);
  const init = num(s.massInitial);
  if(init>0 && pct>0) return init*pct/100;
  return 0;
}
function stockState(s){
  const cur = num(s.massCurrent);
  if(!trim(s.massCurrent) && s.massCurrent!==0) return 'tak-diukur';
  if(cur<=0) return 'habis';
  if(cur<=lowStockThreshold(s)) return 'hampir-habis';
  return 'tersedia';
}
/* Custom field yang berlaku untuk sampel (berdasarkan proyek / tipe sampel / global). */
function customFieldsFor(scope, projectId, typeCode){
  return mdActive('customFieldDefinitions').filter(f=>{
    const target = trim(f.target) || 'sample';
    if(target !== scope) return false;
    if(trim(f.projectId) && trim(f.projectId)!==trim(projectId)) return false;
    if(trim(f.sampleType) && trim(f.sampleType)!==trim(typeCode)) return false;
    return true;
  });
}
function readCustomFields(prefix, defs){
  const out = {};
  defs.forEach(f=>{
    const el = document.getElementById(prefix+f.code);
    if(!el) return;
    out[f.code] = (el.type==='checkbox')? (el.checked?'ya':'tidak') : trim(el.value);
  });
  return out;
}
/* Formulir sampel dipakai di dua tempat: tampilan Registrasi (prefix "f_") dan
   modal Edit (prefix "es_"). Prefix berbeda agar tidak ada ID ganda dalam satu halaman. */
function readSampleForm(existing, px){
  px = px || 'f_';
  const g = id => { const el=document.getElementById(px+id); return el? trim(el.value) : ''; };
  const gc = id => { const el=document.getElementById(px+id); return el? !!el.checked : false; };

  const batch = g('batch'), run = g('run'), replicate = g('replicate');
  /* Kotak centang "kode manual" hanya ada pada tampilan Registrasi. */
  const manual = px==='f_' ? !!(document.getElementById('manualCode')||{}).checked : false;
  const massInit = numOrBlank(g('mass'));
  /* Saat mengedit, kode diambil dari field kode (boleh diubah). Saat registrasi baru,
     kode dibuat generator kecuali pengguna memilih "kode manual". */
  const codeField = document.getElementById(px+'code');
  let code;
  if(existing) code = codeField ? (g('code') || existing.id) : existing.id;
  else if(manual) code = g('code');
  else code = genCode({projectId, material, type, origin, date:regDate, batch, run, replicate});
  const defs = customFieldsFor('sample', projectId, type);
  return Object.assign({}, existing||{}, {
    id: code,
    projectId,
    name: g('name'),
    alias: g('alias'),
    material, type, origin,
    parent: g('parent'),
    relation: g('relation'),
    batch, run, replicate,
    regDate,
    sampleDate: g('sampleDate'),
    samplingLoc: g('samplingLoc'),
    source: g('source'),
    sampler: g('sampler'),
    samplingMethod: g('samplingMethod'),
    cond: g('cond'),
    massInitial: existing? (numOrBlank(g('massInitial'))!==''? numOrBlank(g('massInitial')) : massInit) : massInit,
    massCurrent: existing? numOrBlank(g('massCurrent')) : massInit,
    unit: g('unit'),
    moisture: g('moist'),
    containers: g('containers'),
    containerType: g('containerType'),
    custodian: g('custodian'),
    loc: g('loc'),
    storecond: g('storecond'),
    expiryDate: g('expiry'),
    status: g('status') || 'Terdaftar',
    notes: g('notes'),
    attachments: g('attach'),
    customFields: Object.assign({}, (existing&&existing.customFields)||{}, readCustomFields(px+'cf_', defs)),
    archived: existing? !!existing.archived : false,
    createdAt: existing? (existing.createdAt||now) : now,
    updatedAt: now
  });
}
function validateSample(s, editingId, px){
  px = px || 'f_';
  const F = n => px+n;
  const errs = [];
  if(!DB.projects.length) errs.push({field:F('project'), msg:'Belum ada proyek. Buat proyek penelitian terlebih dahulu di tab "Proyek Riset".'});
  else if(!s.projectId) errs.push({field:F('project'), msg:'Proyek penelitian wajib dipilih.'});
  if(!trim(s.id)) errs.push({field:F('code'), msg:'Kode sampel wajib diisi.'});
  else if(DB.samples.some(x=>x.id!==editingId && x.id===s.id)) errs.push({field:F('code'), msg:'Kode sampel "'+s.id+'" sudah ada di buku induk.'});
  if(!trim(s.material)) errs.push({field:F('material'), msg:'Material / komoditas wajib dipilih.'});
  if(!trim(s.type)) errs.push({field:F('type'), msg:'Tipe sampel wajib dipilih.'});
  if(!trim(s.regDate)) errs.push({field:F('regDate'), msg:'Tanggal registrasi wajib diisi.'});
  if(trim(s.massInitial)!=='' && num(s.massInitial)<0) errs.push({field:F('mass'), msg:'Jumlah/massa awal tidak boleh negatif.'});
  if(trim(s.massCurrent)!=='' && num(s.massCurrent)<0) errs.push({field:F('massCurrent'), msg:'Jumlah/massa terkini tidak boleh negatif.'});
  if(trim(s.containers)!=='' && num(s.containers)<0) errs.push({field:F('containers'), msg:'Jumlah wadah tidak boleh negatif.'});
  if(s.parent){
    if(s.parent===s.id) errs.push({field:F('parent'), msg:'Sampel tidak boleh menjadi induk dirinya sendiri.'});
    else{
      const parent = sampleById(s.parent);
      if(!parent) errs.push({field:F('parent'), msg:'Sampel induk "'+s.parent+'" tidak ditemukan.'});
      else{
        if(isDescendant(s.id, s.parent, {id:s.id, parent:s.parent}))
          errs.push({field:F('parent'), msg:'Hubungan induk melingkar terdeteksi: "'+s.parent+'" merupakan turunan dari sampel ini.'});
        const allowCross = (()=>{ const el=document.getElementById(F('crossProject')); return el? !!el.checked : false; })();
        if(parent.projectId && s.projectId && parent.projectId!==s.projectId && !allowCross)
          errs.push({field:F('parent'), msg:'Induk berada di proyek lain ('+projectLabel(parent.projectId)+'). Centang "izinkan hubungan lintas proyek" bila memang disengaja.'});
      }
    }
    if(!trim(s.relation)) errs.push({field:F('relation'), msg:'Isi hubungan dengan induk (mis. Subsampel, Produk proses).'});
  }
  if(s.expiryDate && s.regDate && s.expiryDate < s.regDate)
    errs.push({field:F('expiry'), msg:'Tanggal kedaluwarsa/retensi tidak boleh mendahului tanggal registrasi.'});
  if(s.attachments && !isSafeUrl(s.attachments) && /^[a-z]+:/i.test(s.attachments))
    errs.push({field:F('attach'), msg:'Tautan lampiran harus berupa http(s):// atau nama berkas biasa.'});
  return errs;
}
async function saveSampleFromForm(opts){
  opts = opts||{};
  const s = readSampleForm(null);
  if(!showErrors(validateSample(s, ''))) return;
  const prefs = regLabelPrefs();
  await rememberLabelPrefs(prefs);
  DB.samples.push(s);
  logAudit('sample', s.id, 'create', null, snapshot(s), '');
  if(s.loc){
    const mv = {
      id: uid('mov'), projectId:s.projectId, sampleCode:s.id, action:'Masuk',
      fromLocation:'', toLocation:s.loc, datetime: nowISO(),
      person: s.custodian||'', receiver: s.custodian||'', purpose:'Registrasi awal',
      condition: s.cond||'', qty: s.massCurrent, unit: s.unit||'', note:'Registrasi awal',
      actor: trim(DB.cfg.activeUser), createdAt: nowISO()
    };
    DB.movements.push(mv);
    logAudit('movement', mv.id, 'create', null, snapshot(mv), 'Otomatis dari registrasi');
  }
  refreshProjectCounters();
  await save(['S','M','P','AL']);
  toast('Sampel '+s.id+' tersimpan ke buku induk');
  VIEW='db'; render();
  setTimeout(()=>openSampleDetail(s.id), 120);
  if(opts.print || prefs.autoPrint){
    const mode = opts.print==='thermal' ? 'thermal' : prefs.mode;
    setTimeout(()=>doPrint([s.id], mode, prefs.copies, prefs.footer), 240);
  }
}
async function saveSampleEdit(oldId){
  const existing = sampleById(oldId); if(!existing) return;
  const before = snapshot(existing);
  const s = readSampleForm(existing, 'es_');
  if(!showErrors(validateSample(s, oldId, 'es_'))) return;
  const newId = s.id;
  Object.assign(existing, s);
  if(oldId!==newId){
    DB.samples.forEach(x=>{ if(x.parent===oldId) x.parent=newId; });
    DB.tests.forEach(t=>{ if(t.sampleCode===oldId) t.sampleCode=newId; });
    DB.movements.forEach(m=>{ if(m.sampleCode===oldId) m.sampleCode=newId; });
  }
  refreshLinkedTests(newId);
  refreshProjectCounters();
  logAudit('sample', newId, 'update', before, snapshot(existing), trim((document.getElementById('es_reason')||{}).value));
  await save(['S','T','M','P','AL']);
  closeModal();
  toast('Perubahan sampel tersimpan');
  render();
  openSampleDetail(newId);
}
function refreshLinkedTests(code){
  const s = sampleById(code); if(!s) return;
  DB.tests.filter(t=>t.sampleCode===code).forEach(t=>{
    t.sampleType   = s.type||'';
    t.sampleParent = s.parent||'';
    t.sampleRun    = s.run||'';
    t.projectId    = t.projectId || s.projectId;
    t.qrData       = buildTestQrPayload(s, t);
  });
}
function refreshProjectCounters(){
  DB.projects.forEach(p=>{
    const st = projectStats(p.id);
    p.sampleCount = st.samples;
    p.testCount   = st.tests;
  });
}
/* Arsip (soft delete) lebih diutamakan daripada penghapusan permanen. */
async function archiveSample(id, restore){
  const s = sampleById(id); if(!s) return;
  const before = snapshot(s);
  s.archived = !restore;
  if(!restore && s.status!=='Diarsipkan'){ s.prevStatus = s.status; s.status='Diarsipkan'; }
  if(restore && s.prevStatus){ s.status = s.prevStatus; delete s.prevStatus; }
  s.updatedAt = nowISO();
  logAudit('sample', id, restore?'restore':'archive', before, snapshot(s), '');
  await save(['S','AL']);
  closeModal();
  toast(restore? 'Sampel dipulihkan dari arsip' : 'Sampel diarsipkan');
  render();
}
async function deleteSamplePermanent(id){
  const s = sampleById(id); if(!s) return;
  const before = snapshot(s);
  const kids = sampleChildren(id);
  kids.forEach(k=>{ k.parent = s.parent || ''; k.updatedAt = nowISO(); });   // jangan meninggalkan yatim
  const tests = DB.tests.filter(t=>t.sampleCode===id);
  const movs  = DB.movements.filter(m=>m.sampleCode===id);
  DB.tests = DB.tests.filter(t=>t.sampleCode!==id);
  DB.movements = DB.movements.filter(m=>m.sampleCode!==id);
  DB.samples = DB.samples.filter(x=>x.id!==id);
  refreshProjectCounters();
  logAudit('sample', id, 'delete', before, null,
    `hapus permanen; ${tests.length} uji & ${movs.length} log ikut dihapus; ${kids.length} anak ditautkan ulang ke ${s.parent||'(tanpa induk)'}`);
  await save(['S','T','M','P','AL']);
  closeModal();
  toast('Sampel '+id+' dihapus permanen');
  VIEW='db'; render();
}

function validateTest(t){
  const errs = [];
  if(!t.sampleCode) errs.push({field:'t_sample', msg:'Sampel wajib dipilih.'});
  else if(!sampleById(t.sampleCode)) errs.push({field:'t_sample', msg:'Sampel "'+t.sampleCode+'" tidak ditemukan.'});
  if(!t.category) errs.push({field:'t_cat', msg:'Kategori pengujian wajib dipilih.'});
  if(trim(t.massUsed)!=='' && num(t.massUsed)<0) errs.push({field:'t_mass', msg:'Jumlah terpakai tidak boleh negatif.'});
  if(t.dateStart && t.dateEnd && t.dateEnd < t.dateStart) errs.push({field:'t_end', msg:'Tanggal selesai tidak boleh mendahului tanggal mulai.'});
  const s = sampleById(t.sampleCode);
  if(s && num(t.massUsed)>0){
    const su = trim(s.unit), tu = trim(t.massUnit)||su;
    if(su && tu && su!==tu && convertQty(1, tu, su)===null){
      errs.push({field:'t_massUnit', msg:'Satuan pemakaian ('+tu+') tidak sepadan dengan satuan stok sampel ('+su+'). Samakan satuan atau tambahkan faktor konversi pada Master Data > Satuan.'});
    }
  }
  return errs;
}
/* Hitung selisih stok yang benar saat tambah/edit/hapus (tidak mengurangi dua kali). */
function stockDelta(sample, oldTest, newTest){
  if(!sample) return 0;
  const su = trim(sample.unit);
  const conv = (qty, unit)=>{
    const q = num(qty); if(!q) return 0;
    const u = trim(unit)||su;
    if(!su || !u || su===u) return q;
    const c = convertQty(q, u, su);
    return c==null? null : c;
  };
  const oldQ = oldTest? conv(oldTest.massUsed, oldTest.massUnit) : 0;
  const newQ = newTest? conv(newTest.massUsed, newTest.massUnit) : 0;
  if(oldQ===null || newQ===null) return null;
  return (newQ||0) - (oldQ||0);
}
function applySampleStatusFromStock(s){
  if(!s) return;
  if(s.archived) return;
  if(trim(s.massCurrent)==='' && s.massCurrent!==0) return;
  const st = stockState(s);
  if(st==='habis' && s.status!=='Diarsipkan' && s.status!=='Dibuang') s.status='Habis';
  else if(st==='hampir-habis' && ['Disimpan','Diuji','Terdaftar'].includes(s.status)) s.status='Hampir habis';
  else if(st==='tersedia' && ['Habis','Hampir habis'].includes(s.status)) s.status='Disimpan';
}
async function saveTestFromForm(editId){
  const existing = editId? testById(editId) : null;
  const before = snapshot(existing);
  const t = readTestForm(existing);
  if(!showErrors(validateTest(t))) return;
  const s = sampleById(t.sampleCode);
  const delta = stockDelta(s, existing, t);
  if(delta===null){
    showErrors([{field:'t_massUnit', msg:'Pengurangan stok dibatalkan: satuan tidak kompatibel dan belum ada faktor konversi.'}]);
    return;
  }
  if(s && delta){
    const next = num(s.massCurrent) - delta;
    if(next < 0){
      showErrors([{field:'t_mass', msg:'Stok tidak mencukupi. Tersisa '+fmtNum(s.massCurrent)+' '+(s.unit||'')+'.'}]);
      return;
    }
    const sBefore = snapshot(s);
    s.massCurrent = next;
    applySampleStatusFromStock(s);
    if(t.status==='Berjalan' && !['Habis','Diarsipkan'].includes(s.status)) s.status='Diuji';
    s.updatedAt = nowISO();
    logAudit('sample', s.id, 'stock', sBefore, snapshot(s), 'Perubahan stok dari pengujian '+(t.testCode||t.id));
  }else if(s && t.status==='Berjalan' && !['Habis','Diarsipkan'].includes(s.status)){
    s.status='Diuji'; s.updatedAt=nowISO();
  }
  if(existing) Object.assign(existing, t);
  else DB.tests.push(t);
  const saved = existing || t;
  saved.qrData = buildTestQrPayload(s, saved);
  saved.processCode = buildProcessCode(s, saved);
  refreshProjectCounters();
  logAudit('test', saved.id, existing?'update':'create', before, snapshot(saved), '');
  await save(['T','S','P','AL']);
  closeModal();
  toast(existing? 'Pengujian diperbarui' : 'Pengujian dicatat');
  render();
  if(s) openSampleDetail(s.id);
}
async function deleteTest(id){
  const t = testById(id); if(!t) return;
  const before = snapshot(t);
  const s = sampleById(t.sampleCode);
  if(s){
    const delta = stockDelta(s, t, null);   // kembalikan stok
    if(delta!==null && delta){
      const sBefore = snapshot(s);
      s.massCurrent = num(s.massCurrent) - delta;   // delta negatif -> stok bertambah
      applySampleStatusFromStock(s);
      s.updatedAt = nowISO();
      logAudit('sample', s.id, 'stock', sBefore, snapshot(s), 'Pengembalian stok karena pengujian dihapus');
    }
  }
  DB.tests = DB.tests.filter(x=>x.id!==id);
  refreshProjectCounters();
  logAudit('test', id, 'delete', before, null, '');
  await save(['T','S','P','AL']);
  closeModal();
  toast('Pengujian dihapus dan stok dikembalikan');
  render();
  if(s) openSampleDetail(s.id);
}

const MOVE_SETS_LOCATION = ['Masuk','Pindah','Dikembalikan','Diterima kembali','Koreksi lokasi','Diarsipkan'];
function movementById(id){ return DB.movements.find(m=>m.id===id) || null; }
function currentLocation(sampleId){
  const list = DB.movements.filter(m=>m.sampleCode===sampleId && m.datetime)
    .sort((a,b)=> new Date(b.datetime)-new Date(a.datetime));
  for(const m of list){
    if(MOVE_SETS_LOCATION.includes(m.action) && trim(m.toLocation)) return trim(m.toLocation);
    if(m.action==='Keluar') return trim(m.toLocation) || '(sedang dipakai)';
    if(m.action==='Dipinjam') return trim(m.toLocation) || '(dipinjam)';
    if(m.action==='Dikirim ke lab eksternal') return trim(m.toLocation) || '(di lab eksternal)';
    if(m.action==='Dimusnahkan') return '(dimusnahkan)';
  }
  return '';
}
function readMovementForm(sampleCode, existing){
  const g = id => { const el=document.getElementById(id); return el? trim(el.value) : ''; };
  const s = sampleById(sampleCode);
  const now = nowISO();
  const dtRaw = g('m_dt');
  let dt = dtRaw? new Date(dtRaw) : new Date();
  /* Input datetime-local hanya berpresisi menit. Bila pengguna memakai menit berjalan,
     pakai waktu sebenarnya agar urutan log (dan lokasi terkini) tidak keliru terhadap
     catatan lain yang dibuat pada menit yang sama. */
  if(!isNaN(dt.getTime())){
    const nowD = new Date();
    if(Math.abs(nowD.getTime()-dt.getTime()) < 60000) dt = nowD;
  }
  return Object.assign({}, existing||{}, {
    id: existing? existing.id : uid('mov'),
    projectId: s? s.projectId : (existing? existing.projectId : ''),
    sampleCode,
    action: g('m_action') || 'Masuk',
    fromLocation: g('m_from'),
    toLocation: g('m_to'),
    datetime: isNaN(dt.getTime())? now : dt.toISOString(),
    person: g('m_person'),
    receiver: g('m_receiver'),
    purpose: g('m_purpose'),
    condition: g('m_condition'),
    qty: numOrBlank(g('m_qty')),
    unit: g('m_unit'),
    note: g('m_note'),
    actor: trim(DB.cfg.activeUser) || (navigator.userAgent? navigator.userAgent.slice(0,60) : ''),
    createdAt: existing? (existing.createdAt||now) : now
  });
}
function validateMovement(m){
  const errs = [];
  if(!m.sampleCode) errs.push({field:'m_action', msg:'Sampel tidak ditemukan.'});
  if(!m.action) errs.push({field:'m_action', msg:'Jenis pergerakan wajib dipilih.'});
  if(MOVE_SETS_LOCATION.includes(m.action) && !trim(m.toLocation))
    errs.push({field:'m_to', msg:'Lokasi tujuan wajib diisi untuk aksi "'+m.action+'".'});
  if(trim(m.qty)!=='' && num(m.qty)<0) errs.push({field:'m_qty', msg:'Jumlah dipindahkan tidak boleh negatif.'});
  return errs;
}
async function saveMovementFromForm(sampleCode, editId){
  const s = sampleById(sampleCode); if(!s) return;
  const existing = editId? movementById(editId) : null;
  const before = snapshot(existing);
  const m = readMovementForm(sampleCode, existing);
  if(!showErrors(validateMovement(m))) return;
  if(existing) Object.assign(existing, m);
  else DB.movements.push(m);
  const saved = existing || m;
  logAudit('movement', saved.id, existing?'update':'create', before, snapshot(saved), '');
  const sBefore = snapshot(s);
  const loc = currentLocation(sampleCode);
  s.loc = loc;
  if(saved.action==='Masuk' && s.status==='Terdaftar') s.status='Disimpan';
  if(saved.action==='Dipinjam') s.status='Dipinjam';
  if(saved.action==='Dikembalikan' && s.status==='Dipinjam') s.status='Disimpan';
  if(saved.action==='Dimusnahkan') s.status='Dibuang';
  if(saved.action==='Diarsipkan') s.status='Diarsipkan';
  s.updatedAt = nowISO();
  logAudit('sample', s.id, 'location', sBefore, snapshot(s), 'Sinkron lokasi dari pergerakan');
  await save(['M','S','AL']);
  closeModal();
  toast(existing? 'Pergerakan diperbarui' : 'Pergerakan dicatat');
  render();
  openSampleDetail(sampleCode);
}
